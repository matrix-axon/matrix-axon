name: Web lint and test

on:
  workflow_dispatch:
  # Push on main has no paths filter: the schema-drift gate consumes
  # openapi/openapi.json, which server-silo PRs change without touching
  # clients/web — drift they introduce is caught here at merge instead of
  # failing some later unrelated web PR.
  push:
    branches:
      - main
  pull_request:
    paths:
      - "openapi/openapi.json"
      - "clients/web/**"
      - ".github/workflows/web-lint-and-test.yml"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  web-lint-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: clients/web

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: clients/web/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: clients/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check generated API client is in sync with openapi/openapi.json
        run: pnpm check:api

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
