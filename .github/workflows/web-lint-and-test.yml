name: Web lint and test

on:
  workflow_dispatch:
  # Push on main has no paths filter: the schema-drift gate consumes
  # openapi/openapi.json, which server-silo PRs change without touching
  # clients/web — drift they introduce is caught here at merge instead of
  # failing some later unrelated web PR.
  push:
    branches:
      - main
  pull_request:
    paths:
      - "openapi/openapi.json"
      - "clients/web/**"
      - ".github/workflows/web-lint-and-test.yml"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  web-lint-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: clients/web

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: clients/web/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: clients/web/pnpm-lock.yaml

      # The job directory is clients/web so the format step below stays the
      # package prettier. These steps run the hook entry from the repo root;
      # the entry already passes `pnpm --dir clients/web`.
      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: python3 scripts/ci/run-hook-entry.py web-install

      # The install above only warns about unmet peers. Mirrors the web-peers
      # pre-push hook; deliberate exceptions live in pnpm-workspace.yaml's
      # peerDependencyRules.
      - name: Check peer dependencies
        working-directory: ${{ github.workspace }}
        run: python3 scripts/ci/run-hook-entry.py web-peers

      - name: Check generated API client is in sync with openapi/openapi.json
        working-directory: ${{ github.workspace }}
        run: python3 scripts/ci/run-hook-entry.py web-api-schema

      - name: Lint
        working-directory: ${{ github.workspace }}
        run: python3 scripts/ci/run-hook-entry.py web-lint

      # Not the repo prettier hook. That hook vendors prettier and checks more
      # than clients/web. This is the package's own check, reported on its own,
      # and scripts/check-hook-commands.py pins this command. It stays in
      # clients/web, which is the job's working-directory.
      - name: Check formatting
        run: pnpm format:check

      - name: Test
        working-directory: ${{ github.workspace }}
        run: python3 scripts/ci/run-hook-entry.py web-test

      - name: Build
        working-directory: ${{ github.workspace }}
        run: python3 scripts/ci/run-hook-entry.py web-build
