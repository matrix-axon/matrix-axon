name: Native Linux packages

# Builds .deb and .rpm from glibc-2.35 binaries (ubuntu-22.04 / ubuntu-22.04-arm)
# so Debian bookworm and Ubuntu 22.04+ can run them.
# On version tags, the same artifacts are attached to the GitHub Release that
# cross-build.yml already fills with zip archives.

on:
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/package.yml"
      - "crates/axon-server/**"
      - "crates/axon-core/**"
      - "crates/axon-store/**"
      - "crates/axon-api/**"
      - "crates/axon-sync/**"
      - "crates/axon-crypto/**"
      - "crates/axon-search/**"
      - "crates/axon-media/**"
      - "Cargo.lock"
  push:
    tags:
      - "v*"
      - "beta-*"
      - "alpha-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: Shellcheck maintainer scripts
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck -s sh packaging/scripts/postinst.sh packaging/scripts/prerm.sh packaging/scripts/postrm.sh
          shellcheck packaging/package.sh

  packages:
    name: .deb and .rpm (${{ matrix.arch }})
    needs: shellcheck
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
            nfpm_asset: Linux_x86_64
            # sha256 of nfpm_2.47.0_Linux_x86_64.tar.gz
            nfpm_sha256: 0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783
          - runner: ubuntu-22.04-arm
            arch: arm64
            nfpm_asset: Linux_arm64
            # sha256 of nfpm_2.47.0_Linux_arm64.tar.gz
            nfpm_sha256: 1c0f5f2999b9a974bfb04fdb0cc3306096de530ac5dbb25d739cc5f5219c919c
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake clang libclang-dev rpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install nFPM
        env:
          NFPM_VERSION: 2.47.0
          NFPM_ASSET: ${{ matrix.nfpm_asset }}
          NFPM_SHA256: ${{ matrix.nfpm_sha256 }}
        run: |
          curl -fsSL -o /tmp/nfpm.tgz \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_${NFPM_ASSET}.tar.gz"
          echo "${NFPM_SHA256}  /tmp/nfpm.tgz" | sha256sum -c -
          tar -xz -C /tmp -f /tmp/nfpm.tgz nfpm
          sudo mv /tmp/nfpm /usr/local/bin/nfpm
          nfpm --version

      - name: Build axon-server
        run: cargo build --release -p axon-server --bin axon-server

      - name: Package
        env:
          ARCH: ${{ matrix.arch }}
        run: packaging/package.sh all

      - name: Inspect artifacts
        run: |
          deb=$(ls target/nfpm/*.deb)
          rpm=$(ls target/nfpm/*.rpm)
          dpkg --info "$deb"
          dpkg --contents "$deb"
          rpm -qp --info "$rpm"
          rpm -qp --list "$rpm"

      - uses: actions/upload-artifact@v7
        with:
          name: axon-server-linux-${{ matrix.arch }}-packages
          path: target/nfpm/*
          if-no-files-found: error

  release:
    name: Attach packages to GitHub Release
    needs: packages
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-22.04
    # Same group as cross-build.yml's release job: serialize first-time
    # GitHub Release creates for a tag. Builds still run in parallel.
    concurrency:
      group: github-release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download linux packages
        uses: actions/download-artifact@v8
        with:
          pattern: axon-server-linux-*-packages
          path: packages
          merge-multiple: true

      - name: Publish packages
        uses: softprops/action-gh-release@v3
        with:
          files: packages/*
          fail_on_unmatched_files: true
