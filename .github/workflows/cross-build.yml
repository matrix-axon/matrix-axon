name: Cross-platform build
#
# Builds the whole workspace for every platform we ship binaries for, each on
# its own GitHub-hosted runner (native compilation, no cross/osxcross):
#   - Linux (x86_64-unknown-linux-gnu) — ubuntu-latest, native
#   - Windows (x86_64-pc-windows-msvc) — windows-latest, native
#   - macOS, Intel + Apple Silicon (x86_64-apple-darwin, aarch64-apple-darwin)
#     — macos-latest, native, cross-compiling the Intel slice via rustup's
#     macOS target support (Apple Silicon runners can build x86_64-apple-darwin
#     without a separate SDK setup).
#
# Every dependency in the graph is rustls/aws-lc-rs (no OpenSSL, no native-tls)
# and sqlx's Postgres driver is compiled in directly (no libpq), so there's no
# native library per platform to worry about.
#
# Each of the four build targets above (windows, linux, macos-intel,
# macos-silicon) uploads three zips — axon-tui-<target> (client only),
# axon-server-<target> (server only), and axon-<target> (both binaries) — so
# a release ends up with 12 binary assets plus GitHub's two auto-generated
# source archives. We intentionally ship per-arch macOS binaries rather than
# a lipo'd universal binary: it matches how the Windows/Linux zips are
# already one-arch-per-file, and avoids a fat binary silently masking a
# broken osxcross target for one architecture.

on:
  push:
    tags:
      - 'v*' 
      - 'beta-*'
      - 'alpha-*'
  workflow_dispatch:
    inputs:
      release:
        description: "Build with --release (uncheck for a faster debug build)"
        type: boolean
        default: true
      checks:
        description: "Perform linting and formatting checks"
        type: boolean
        default: true
      macos:
        description: "Build MacOS binaries"
        type: boolean
        default: true
      windows:
        description: "Build Windows binaries"
        type: boolean
        default: true
      linux:
        description: "Build Linux binaries"
        type: boolean
        default: true
      homebrew:
        description: "Publish Homebrew formulas"
        type: boolean
        default: true
      homebrew_tag:
        description: "Existing stable release tag to publish (vX.Y.Z). Used only for a manual run; a tag push publishes that tag. Leave empty to skip the tap on a manual run."
        type: string
        default: ""

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always
  # cargo's built-in `dev` profile writes to target/<triple>/debug, not
  # target/<triple>/dev — this picks the matching directory name for whichever
  # profile flag we pass below, so every job/step agrees on where to look.
  PROFILE_DIR: ${{ (github.event.inputs.release != 'false') && 'release' || 'debug' }}
  RELEASE_FLAG: ${{ (github.event.inputs.release != 'false') && '--release' || '' }}

jobs:
  generate-thirdparty:
    name: Generate license disclosure
    runs-on: ubuntu-latest
    steps:
      - name: checkout source code
        uses: actions/checkout@v7

      - name: check-environment
        uses: ./.github/actions/check-environment

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Every build job needs this one, so a tag that disagrees with the
      # Cargo version (what `axon-server --version` prints) stops here,
      # before anything is built or attached to a Release. release-plz
      # keeps the two equal; this catches a tag pushed by hand.
      - name: Tag matches the workspace version
        run: scripts/release-version.sh check

      # --root-only: this job feeds the server and TUI release archives, which
      # ship none of the desktop shell. Without the flag it would also resolve
      # and license-check `src-tauri`'s dependency graph and then discard both
      # desktop notices, so a crate in the shell could fail a release that does
      # not contain it. `desktop-build.yml` owns those notices.
      - name: Generate license disclosure file
        run: scripts/generate-thirdparty.sh --root-only

      # The same assertion `desktop-build.yml` makes about the shell's notices,
      # for the root pair. A release must not ship a disclosure that has
      # drifted from the graph it was built from. `thirdparty.yml` makes this
      # same check on pull requests, which is where a contributor can still act
      # on it; by the time a tag is pushed, failing here is the last chance
      # rather than the first.
      - name: Assert the committed notices match the dependency graph
        run: |
          if ! git diff --exit-code --stat -- build/THIRDPARTY THIRDPARTY.md; then
            echo "::error::the committed root license notice is stale. Run scripts/generate-thirdparty.sh --root-only and commit the result." >&2
            exit 1
          fi

      - name: Upload license disclosure artifact
        uses: actions/upload-artifact@v7
        with:
          name: thirdparty-license
          path: build/THIRDPARTY
          if-no-files-found: error

  # The web client that every server binary below carries (ADR 0116). Built
  # once, on Linux, and handed to the three platform jobs as an artifact: the
  # bundle is the same bytes on every platform, and this keeps Node off the
  # Windows and macOS builders.
  web-bundle:
    name: Build the web bundle
    runs-on: ubuntu-latest
    steps:
      - name: checkout source code
        uses: actions/checkout@v7

      - name: Build the web bundle
        id: bundle
        uses: ./.github/actions/web-bundle

      - name: Upload the web bundle
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: ${{ steps.bundle.outputs.dist }}
          if-no-files-found: error

  lint-fmt-test:
    name: rustfmt, clippy, and test
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.checks != 'false' }}
    steps:
      - name: checkout source code
        uses: actions/checkout@v7

      - name: check-environment
        uses: ./.github/actions/check-environment

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all

  windows:
    name: Build for Windows
    needs: [generate-thirdparty, web-bundle]
    strategy:
      fail-fast: true
      matrix:
        target:
          - x86_64-pc-windows-msvc

    runs-on: windows-latest
    if: ${{ github.event.inputs.windows != 'false' }}
    # Authenticode signing (ADR 0119). `id-token` is what lets azure/login
    # trade the job's OIDC token for an Azure session; there is no stored
    # credential. The federated credential in Entra is bound to the
    # `release-signing` environment's subject, because Azure federation does
    # not take wildcards and a tag name is not known in advance.
    #
    # Only a `v*` tag enters that environment, whose deployment policy admits
    # nothing else, and only that ref signs. Every other ref this workflow
    # supports (alpha-*/beta-* tags, branch dispatches) runs with no
    # environment and builds unsigned: the `enabled` input below is what keeps
    # it from attempting a login its federated credential would refuse.
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release-signing' || '' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: checkout source code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Download license disclosure artifact
        uses: actions/download-artifact@v8
        with:
          name: thirdparty-license
          path: build

      - name: Download the web bundle
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web-dist

      # AXON_WEB_DIST makes a missing bundle a build error (ADR 0116).
      - name: Build workspace (Windows native)
        env:
          AXON_WEB_DIST: ${{ github.workspace }}/web-dist
        run: |
          rustup target add x86_64-pc-windows-msvc
          cargo build --workspace --features axon-server/embed-web --target ${{ matrix.target }} ${{ env.RELEASE_FLAG }}

      - name: Assert the server carries the web client
        shell: bash
        run: scripts/assert-web-embedded.sh "target/${{ matrix.target }}/${{ env.PROFILE_DIR }}/axon-server.exe" web-dist

      # Sign the executables, not the zips: a zip cannot carry a signature, so
      # what SmartScreen and Defender judge is the .exe inside it. Signing
      # comes after the web-embed assertion (the assertion reads the unsigned
      # file) and before packaging. Both steps are no-ops when signing is not
      # configured; `sign` verifies each signature before returning.
      - name: Set up Windows signing
        uses: ./.github/actions/windows-signing
        with:
          enabled: ${{ startsWith(github.ref, 'refs/tags/v') }}
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          account: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          profile: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign the binaries
        shell: pwsh
        run: |
          $BIN = "target/${{ matrix.target }}/${{ env.PROFILE_DIR }}"
          scripts/sign-windows.ps1 sign "$BIN/axon-server.exe" "$BIN/axon-tui.exe"

      # Windows runners have no `zip` (Git Bash doesn't ship one), so use
      # PowerShell's Compress-Archive. Like `zip -j` on the other platforms, it
      # stores the named files flat at the archive root.
      - name: Zip binaries
        shell: pwsh
        run: |
          $BIN = "target/${{ matrix.target }}/${{ env.PROFILE_DIR }}"
          # No reverse-proxy site files here, unlike the macOS and Linux zips:
          # the Homebrew formula is what reads them, and their instructions
          # are Linux paths.
          Compress-Archive -Force -DestinationPath target/axon-tui-windows.zip `
            -Path "$BIN/axon-tui.exe", build/THIRDPARTY, LICENSE.md
          Compress-Archive -Force -DestinationPath target/axon-server-windows.zip `
            -Path "$BIN/axon-server.exe", build/THIRDPARTY, LICENSE.md
          Compress-Archive -Force -DestinationPath target/axon-windows.zip `
            -Path "$BIN/axon-server.exe", "$BIN/axon-tui.exe", build/THIRDPARTY, LICENSE.md

      - name: Upload axon-tui artifact
        uses: actions/upload-artifact@v7
        with:
          name: axon-tui-windows.zip
          path: target/axon-tui-windows.zip
          if-no-files-found: error

      - name: Upload axon-server artifact
        uses: actions/upload-artifact@v7
        with:
          name: axon-server-windows.zip
          path: target/axon-server-windows.zip
          if-no-files-found: error

      - name: Upload combined artifact
        uses: actions/upload-artifact@v7
        with:
          name: axon-windows.zip
          path: target/axon-windows.zip
          if-no-files-found: error

  macos:
    name: Build for MacOS (Intel and Silicon)
    needs: [generate-thirdparty, web-bundle]
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-apple-darwin
            arch: intel
          - target: aarch64-apple-darwin
            arch: silicon
    runs-on: macos-latest
    if: ${{ github.event.inputs.macos != 'false' }}
    steps:
      - name: Add rustup/cargo home and local binaries to PATH
        run: |
          echo "RUSTUP_HOME=$HOME/.rustup-macos" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$HOME/.cargo-macos" >> "$GITHUB_ENV"
          echo "$HOME/.rustup-macos/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo-macos/bin" >> "$GITHUB_PATH"

      - name: checkout source code
        uses: actions/checkout@v7

      - name: check-environment
        uses: ./.github/actions/check-environment

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            target
          key: macos-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: macos-${{ matrix.target }}-cargo-

      - name: Download license disclosure artifact
        uses: actions/download-artifact@v8
        with:
          name: thirdparty-license
          path: build

      - name: Download the web bundle
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web-dist

      # AXON_WEB_DIST makes a missing bundle a build error (ADR 0116).
      - name: Build workspace (macOS native)
        env:
          AXON_WEB_DIST: ${{ github.workspace }}/web-dist
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin
          cargo build --workspace --features axon-server/embed-web --target ${{ matrix.target }} ${{ env.RELEASE_FLAG }}

      - name: Assert the server carries the web client
        run: scripts/assert-web-embedded.sh "target/${{ matrix.target }}/${{ env.PROFILE_DIR }}/axon-server" web-dist

      - name: Zip binaries
        run: |
          BIN=target/${{ matrix.target }}/${{ env.PROFILE_DIR }}
          # Reverse-proxy site files for the web client ride with every server
          # zip; the Homebrew formula installs them as documentation.
          zip -j target/axon-tui-macos-${{ matrix.arch }}.zip $BIN/axon-tui build/THIRDPARTY LICENSE.md
          zip -j target/axon-server-macos-${{ matrix.arch }}.zip $BIN/axon-server build/THIRDPARTY LICENSE.md packaging/proxy/axon-server.*
          zip -j target/axon-macos-${{ matrix.arch }}.zip $BIN/axon-server $BIN/axon-tui build/THIRDPARTY LICENSE.md packaging/proxy/axon-server.*

      - name: Upload axon-tui artifact
        uses: actions/upload-artifact@v7
        with:
          name: axon-tui-macos-${{ matrix.arch }}.zip
          path: target/axon-tui-macos-${{ matrix.arch }}.zip
          if-no-files-found: error

      - name: Upload axon-server artifact
        uses: actions/upload-artifact@v7
        with:
          name: axon-server-macos-${{ matrix.arch }}.zip
          path: target/axon-server-macos-${{ matrix.arch }}.zip
          if-no-files-found: error

      - name: Upload combined artifact
        uses: actions/upload-artifact@v7
        with:
          name: axon-macos-${{ matrix.arch }}.zip
          path: target/axon-macos-${{ matrix.arch }}.zip
          if-no-files-found: error

  linux:
    name: Build for Linux
    needs: [generate-thirdparty, web-bundle]
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.linux != 'false' }}
    steps:
      - name: Add rustup/cargo home and local binaries to PATH
        run: |
          echo "RUSTUP_HOME=$HOME/.rustup-linux" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$HOME/.cargo-linux" >> "$GITHUB_ENV"
          echo "$HOME/.rustup-linux/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo-linux/bin" >> "$GITHUB_PATH"

      - name: checkout source code
        uses: actions/checkout@v7

      - name: check-environment
        uses: ./.github/actions/check-environment

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            target
          key: linux-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: linux-cargo-

      - name: Download license disclosure artifact
        uses: actions/download-artifact@v8
        with:
          name: thirdparty-license
          path: build

      - name: Download the web bundle
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web-dist

      # AXON_WEB_DIST makes a missing bundle a build error (ADR 0116).
      - name: Build workspace (native Linux)
        env:
          AXON_WEB_DIST: ${{ github.workspace }}/web-dist
        run: cargo build --workspace --features axon-server/embed-web --target x86_64-unknown-linux-gnu ${{ env.RELEASE_FLAG }}

      - name: Assert the server carries the web client
        run: scripts/assert-web-embedded.sh "target/x86_64-unknown-linux-gnu/${{ env.PROFILE_DIR }}/axon-server" web-dist

      - name: Zip binaries
        run: |
          BIN=target/x86_64-unknown-linux-gnu/${{ env.PROFILE_DIR }}
          # Reverse-proxy site files for the web client ride with every server
          # zip; the Homebrew formula installs them as documentation.
          zip -j target/axon-tui-linux.zip $BIN/axon-tui build/THIRDPARTY LICENSE.md
          zip -j target/axon-server-linux.zip $BIN/axon-server build/THIRDPARTY LICENSE.md packaging/proxy/axon-server.*
          zip -j target/axon-linux.zip $BIN/axon-server $BIN/axon-tui build/THIRDPARTY LICENSE.md packaging/proxy/axon-server.*

      - name: Upload axon-tui artifact
        uses: actions/upload-artifact@v7
        with:
          name: axon-tui-linux.zip
          path: target/axon-tui-linux.zip
          if-no-files-found: error

      - name: Upload axon-server artifact
        uses: actions/upload-artifact@v7
        with:
          name: axon-server-linux.zip
          path: target/axon-server-linux.zip
          if-no-files-found: error

      - name: Upload combined artifact
        uses: actions/upload-artifact@v7
        with:
          name: axon-linux.zip
          path: target/axon-linux.zip
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    name: Publish GitHub Release
    needs: [windows, macos, linux]
    if: ${{ !failure() && !cancelled() && github.ref_type == 'tag' }}
    # Same group as package.yml's release job: serialize first-time
    # GitHub Release creates for a tag. Builds still run in parallel.
    concurrency:
      group: github-release-${{ github.ref }}
      cancel-in-progress: false

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all compiled binaries
        uses: actions/download-artifact@v8
        with:
          pattern: axon*.zip
          path: release-binaries
          merge-multiple: true

      - name: Publish binaries
        uses: softprops/action-gh-release@v3
        with:
          files: release-binaries/*

  # Checksums the macOS and Linux zips on a GitHub Release, waits for
  # desktop-build.yml to attach the universal disk image, and pushes
  # Formula/axon-server.rb, Formula/axon-tui.rb, and Casks/axon.rb to
  # matrix-axon/homebrew-tap in one commit. Does not upload release assets,
  # so it stays out of the github-release concurrency group.
  # A tag push publishes only after this workflow's release job succeeds.
  # release is skipped, not failed, when a build job fails, so a tag push
  # must not treat "skipped" as permission to publish: the zips were never
  # uploaded. A manual run with homebrew_tag set publishes that existing
  # release and does not need the build jobs. beta-*/alpha-* tags are not
  # published. If the disk image never appears, the formulas are still
  # published and the cask is left unchanged. A later run of the same tag
  # adds the cask.
  homebrew-tap:
    name: Publish Homebrew formula
    needs: release
    if: >-
      always() &&
      !cancelled() &&
      github.event.inputs.homebrew != 'false' &&
      (
        (
          github.ref_type == 'tag' &&
          startsWith(github.ref_name, 'v') &&
          needs.release.result == 'success'
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.homebrew_tag != '' &&
          (needs.release.result == 'success' || needs.release.result == 'skipped')
        )
      )
    runs-on: ubuntu-latest
    # One tap branch for every tag: two tags pushed together would otherwise
    # race to push main, and the loser fails non-fast-forward.
    concurrency:
      group: homebrew-tap
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Publish formula to matrix-axon/homebrew-tap
        env:
          TAG: ${{ github.event.inputs.homebrew_tag != '' && github.event.inputs.homebrew_tag || github.ref_name }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: packaging/homebrew/publish-tap.sh
