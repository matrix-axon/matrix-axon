name: Notify opened issues and pull requests

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

# This workflow checks out only the base branch to use the shared sender helper.
# It never checks out or executes pull-request code, so fork PRs can use the
# repository notification secret safely.
permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      # pull_request_target must use only the base branch; never execute PR code.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Notify axon-developer room of new issue or PR
        env:
          NOTIFY_URL: ${{ secrets.NOTIFY_URL }}
          NOTIFY_TOKEN: ${{ secrets.NOTIFY_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "issues" ]; then
            KIND="issue"
            TITLE="$ISSUE_TITLE"
            BODY="$ISSUE_BODY"
            URL="$ISSUE_URL"
            AUTHOR="$ISSUE_AUTHOR"
          else
            KIND="pull request"
            TITLE="$PR_TITLE"
            BODY="$PR_BODY"
            URL="$PR_URL"
            AUTHOR="$PR_AUTHOR"
          fi

          # The title, body and author are attacker-controlled: anyone can open
          # an issue, and pull_request_target fires for any fork. The webhook
          # renders Markdown, so escape it the way the plugin's own escape_md
          # filter does -- otherwise a body can forge a CI-looking notice whose
          # link label reads as a github.com URL and whose target is not. Raw
          # HTML needs no handling here; the plugin's Jinja autoescape covers it.
          #
          # Line-leading `#` is escaped on top of that, because headings are the
          # visual signature of the smoke notices in the same room -- an
          # unescaped body can mint a convincing "## true-local: FAILED" even
          # with its links already defanged. Lists and blockquotes are left to
          # render: they forge nothing, and mangling them would make every
          # ordinary issue body harder to read. Only the URL is trusted enough
          # to link.
          NOTIFY_MESSAGE="$(jq -nr \
            --arg kind "$KIND" \
            --arg author "$AUTHOR" \
            --arg title "$TITLE" \
            --arg body "$BODY" \
            --arg url "$URL" \
            '
            def escape_md: gsub("(?<c>[\\\\`*_\\[\\]])"; "\\\(.c)");
            def escape_headings:
              gsub("(?<p>\n)(?<h>#)"; "\(.p)\\\(.h)") | sub("^#"; "\\#");
            ("New " + $kind + " opened by @" + ($author | escape_md)
              + ": " + ($title[0:200] | escape_md))
              + "  \n[" + $url + "](" + $url + ")"
              + "  \n\n"
              + ($body[0:4000] | escape_md | escape_headings)')"

          export NOTIFY_MESSAGE
          ./scripts/send-matrix-notification.sh
