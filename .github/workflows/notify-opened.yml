name: Notify opened issues and pull requests

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

# This workflow checks out only the base branch to use the shared sender helper.
# It never checks out or executes pull-request code, so fork PRs can use the
# repository notification secret safely.
permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      # pull_request_target must use only the base branch; never execute PR code.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Notify axon-developer room
        env:
          NOTIFY_HOMESERVER: ${{ secrets.NOTIFY_HOMESERVER }}
          NOTIFY_ROOM: ${{ secrets.NOTIFY_ROOM }}
          NOTIFY_TOKEN: ${{ secrets.NOTIFY_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "issues" ]; then
            KIND="issue"
            TITLE="$ISSUE_TITLE"
            BODY="$ISSUE_BODY"
            URL="$ISSUE_URL"
            AUTHOR="$ISSUE_AUTHOR"
          else
            KIND="pull request"
            TITLE="$PR_TITLE"
            BODY="$PR_BODY"
            URL="$PR_URL"
            AUTHOR="$PR_AUTHOR"
          fi

          MATRIX_BODY="$(jq -nr \
            --arg kind "$KIND" \
            --arg author "$AUTHOR" \
            --arg title "$TITLE" \
            --arg body "$BODY" \
            --arg url "$URL" \
            '(("New " + $kind + " opened by @" + $author + ": " + $title)
              + "\n" + $url
              + "\n\n"
              + ($body[0:4000]))')"

          export MATRIX_BODY
          ./scripts/send-matrix-notification.sh
