name: Lint and clippy

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: check-environment
        uses: ./.github/actions/check-environment

      # Same script the pre-push hook runs (.pre-commit-config.yaml), so CI and
      # the local gate cannot disagree about what a valid ADR number is.
      - name: check-duplicate-adrs
        shell: bash
        run: ./scripts/check-adr-numbers.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: binary-builder-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: binary-builder-cargo-

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
