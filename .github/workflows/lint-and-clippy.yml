name: Rust lint and test

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

# A new push to a PR cancels the run for the commit it replaced. release-plz
# pushes its release commit and then force-pushes an amended one carrying the
# bundle version (release-plz.yml); the first commit fails check-bundle-version
# by design, and left running it leaves a red check on the PR beside the green
# one for the head. Every other event is keyed on its SHA, so each push to main
# (and each manual run) has a group to itself and is never cancelled or replaced
# while pending: a shared group holds one running and one pending run, and a
# newer pending run would drop the one for a middle commit.
concurrency:
  group: lint-and-clippy-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always

jobs:
  # ADR 0141 pilot: a self-hosted runner when one is free, otherwise ubuntu-latest.
  # The picker never fails, and `!cancelled()` with the fallback in `runs-on` keeps
  # this required job running on a hosted runner even if the picker job itself
  # could not run.
  pick:
    uses: ./.github/workflows/pick-runner.yml
    secrets:
      RUNNER_PICKER_PRIVATE_KEY: ${{ secrets.RUNNER_PICKER_PRIVATE_KEY }}

  lint-and-test:
    needs: pick
    if: ${{ !cancelled() }}
    runs-on: ${{ fromJSON(needs.pick.outputs.linux || '"ubuntu-latest"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Two commits: on a pull request the checkout is the merge commit, and
          # `rust-changed` below diffs it against its first parent (the base).
          fetch-depth: 2

      - name: check-environment
        uses: ./.github/actions/check-environment
        with:
          # What this job takes from the machine. node: bundle-version.sh.
          # shellcheck: actionlint silently skips its run: checks without it.
          # jq: the runner script tests. cc, c++, make, cmake, pkg-config: the
          # native crates (aws-lc-sys, zstd-sys). git and curl: checkout and the
          # Rust toolchain install.
          require-commands: git curl jq shellcheck node cc c++ make cmake pkg-config

      # CI runs the *hooks*, not second copies of the same checks: the commands
      # and pinned versions are whatever .pre-commit-config.yaml says, so the
      # local gate and CI cannot drift. Placed before the toolchain install --
      # a malformed workflow file or a duplicate ADR number should fail in
      # seconds, not after a cargo build.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          # Hosted runners need a restored pip cache; the self-hosted runner
          # retains its own cache between jobs.
          cache: ${{ runner.environment != 'self-hosted' && 'pip' || '' }}
          # The repo has no requirements.txt or pyproject.toml, and `cache: pip`
          # fails outright ("No file matched to ...") rather than degrading when
          # it finds none. Any tracked file serves as the cache key; this is the
          # one whose change should invalidate it.
          cache-dependency-path: .pre-commit-config.yaml

      - name: Cache pre-commit environments
        if: runner.environment != 'self-hosted'
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          # Keep hosted environments separate from older self-hosted caches.
          key: pre-commit-${{ runner.environment }}-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        shell: bash
        # pyyaml is named although pre-commit depends on it: scripts/ci/
        # changed-by-hook.py imports it directly, and a dependency that is only
        # present transitively can disappear without anyone editing this file.
        run: python -m pip install --disable-pip-version-check pre-commit pyyaml

      - name: actionlint
        shell: bash
        run: pre-commit run actionlint --all-files --hook-stage pre-push

      - name: check-duplicate-adrs
        shell: bash
        run: pre-commit run adr-numbers --all-files --hook-stage pre-push

      # The #180 regression guard. Without a CI step it only runs for people
      # who installed the hook, so a filter broken by --no-verify or from an
      # un-set-up clone would merge unnoticed -- and no other job would catch
      # it, because a filter that selects nothing looks exactly like one that
      # selects correctly.
      - name: check-hook-filters
        shell: bash
        run: pre-commit run hook-filters --all-files --hook-stage pre-push

      # Expensive hooks stay separate steps. Each one executes the hook entry
      # through scripts/ci/run-hook-entry.py. This fails when a step's command
      # is not that invocation, or when the step is turned off (#200).
      - name: check-hook-commands
        shell: bash
        run: pre-commit run hook-commands --all-files --hook-stage pre-push

      # scripts/check-liquid.sh says CI runs it over the whole tree through
      # this hook. Cheap, and a brace that skipped the local hook still fails
      # the required job.
      - name: check-liquid
        shell: bash
        run: pre-commit run markdown-no-liquid --all-files --hook-stage pre-push

      # Whether this pull request changes anything the Rust gate below reads.
      # Everything above and `check-bundle-version` stays unconditional; only
      # the cache restore, rustfmt, clippy and the test suite -- the 20-30
      # minutes -- are skipped, and only on a pull request that touches none of
      # `*rust_files` in .pre-commit-config.yaml, the same filter the pre-push
      # hooks use. The job itself must still run and pass: it is a required
      # check, and a required check that never reports blocks the merge, which
      # is why this is a step condition and not a `paths:` filter on the
      # workflow. Pushes to main and manual runs get no `--base`, so they run
      # the full gate. See scripts/ci/changed-by-hook.py for the fail-safes.
      # The decision logic gates a required check, so it is tested: a filter or
      # `--also` edit that silently changed what gets skipped would otherwise be
      # found only by a skipped test that should have run.
      - name: test changed-by-hook
        shell: bash
        run: python -I scripts/ci/test-changed-by-hook.py

      # The runner picker and the self-hosted runners' hook and start check
      # (ADR 0141). The hook is the fork-PR boundary, so it is tested like code.
      - name: test runner scripts
        shell: bash
        run: |
          scripts/ci/test-pick-runner.sh
          scripts/ci/test-runner-job-started.sh
          scripts/ci/test-runner-preflight.sh

      - name: rust-changed
        id: rust-changed
        shell: bash
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
        run: python scripts/ci/changed-by-hook.py rust-clippy --base "$BASE"

      # Not conditional: `check-bundle-version` below asks cargo for the
      # workspace version, and it runs on a change to clients/web/package.json,
      # which is not a Rust input.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Keep self-hosted artifacts outside the checkout, which checkout cleans.
      # RUNNER_TEMP is inside the runner's writable _work directory, but is
      # itself cleaned between jobs; its sibling persists on the runner's disk.
      - name: Use persistent self-hosted Cargo target
        if: runner.environment == 'self-hosted'
        shell: bash
        run: echo "CARGO_TARGET_DIR=$(dirname "$RUNNER_TEMP")/axon-lint-target" >> "$GITHUB_ENV"

      - name: Cache Cargo registry and build
        if: steps.rust-changed.outputs.changed == 'true' && runner.environment != 'self-hosted'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Keep hosted artifacts separate from any older self-hosted cache.
          key: cargo-${{ runner.environment }}-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'clients/web/src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.environment }}-${{ runner.os }}-

      # After the toolchain: the script asks cargo for the workspace version.
      # In this job, which is a required check, so a release PR whose
      # package.json was not carried (release-plz.yml) cannot merge.
      - name: check-bundle-version
        shell: bash
        run: pre-commit run bundle-version --all-files --hook-stage pre-push

      # The rustfmt, rust-clippy, and cargo-test hook entries. The runner
      # reads them from .pre-commit-config.yaml, including clippy's env prefix.
      - name: Check formatting
        if: steps.rust-changed.outputs.changed == 'true'
        run: python3 scripts/ci/run-hook-entry.py rustfmt

      - name: Clippy
        if: steps.rust-changed.outputs.changed == 'true'
        run: python3 scripts/ci/run-hook-entry.py rust-clippy

      - name: Test
        if: steps.rust-changed.outputs.changed == 'true'
        run: python3 scripts/ci/run-hook-entry.py cargo-test
