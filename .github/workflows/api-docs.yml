name: Deploy API docs

# Publish the whole GitHub Pages site: the project homepage plus the Redoc API
# reference generated from openapi/openapi.json.
#
#   https://matrix-axon.github.io/matrix-axon/          — homepage (README.md)
#   https://matrix-axon.github.io/matrix-axon/api.html  — API reference
#
# Two things this has to get right:
#
# 1. Actions-based Pages replaces the *entire* site with the uploaded artifact —
#    it is not a partial upload alongside whatever was there before. The repo has
#    no index.html of its own; the homepage exists only because Jekyll renders
#    README.md. So the artifact has to contain the built site, not just the API
#    page, or `/` starts 404ing. `jekyll-build-pages` below reproduces exactly
#    what legacy branch mode was building, and the API page is copied in beside
#    it.
#
# 2. Nothing here names the published URL, and there is no setting that does.
#    A file's URL is the site root plus its path inside the artifact, so
#    `_site/api.html` is served at `<site>/api.html`. (`deploy-pages`' `page_url`
#    output is always the site root — it is the environment link, not a target.)
#
# Repo prerequisite: Settings → Pages → Source must be **GitHub Actions**. While
# it is left on the legacy "deploy from a branch" mode, `deploy-pages` still
# reports success but the live site keeps being built from the branch instead,
# so a green run is not evidence that this workflow published anything.

on:
  push:
    branches:
      - main
    paths:
      - 'openapi/openapi.json'
      - 'README.md'
      - '.github/workflows/api-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize deployments; let an in-flight publish finish rather than cancelling
# it, so the live site is never left mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site and API reference
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Build the Jekyll site
        # Same build legacy branch mode ran, so the homepage is unchanged.
        uses: actions/jekyll-build-pages@v1
        with:
          source: .
          destination: ./_site

      - name: Setup Node.js
        uses: actions/setup-node@v6

      - name: Build Redoc API reference into the site
        run: |
          # jekyll-build-pages is a Docker container action, so it runs as root
          # and leaves _site owned by root; this step runs as `runner` and would
          # otherwise fail with EACCES writing into it.
          sudo chown -R "$(id -u):$(id -g)" _site
          npx --yes @redocly/cli build-docs openapi/openapi.json --output=_site/api.html

      - name: Check the site has both pages
        # Cheap guard against the silent-success failure mode this workflow has
        # already hit twice: a deploy step that "succeeds" while publishing the
        # wrong thing. Fail here instead of shipping a broken site.
        run: |
          test -s _site/index.html || { echo "::error::_site/index.html missing — the homepage would 404"; exit 1; }
          test -s _site/api.html   || { echo "::error::_site/api.html missing — the API reference was not generated"; exit 1; }

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
