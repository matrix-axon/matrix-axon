name: Deploy API docs

# Publish the whole GitHub Pages site: the project homepage plus the Redoc API
# reference generated from openapi/openapi.json.
#
#   https://matrix-axon.github.io/matrix-axon/          — homepage (README.md)
#   https://matrix-axon.github.io/matrix-axon/api.html  — API reference
#
# Two things this has to get right:
#
# 1. Actions-based Pages replaces the *entire* site with the uploaded artifact —
#    it is not a partial upload alongside whatever was there before. The repo has
#    no index.html of its own; the homepage exists only because Jekyll renders
#    README.md. So the artifact has to contain the built site, not just the API
#    page, or `/` starts 404ing. `jekyll-build-pages` below reproduces exactly
#    what legacy branch mode was building, and the API page is copied in beside
#    it.
#
# 2. Nothing here names the published URL, and there is no setting that does.
#    A file's URL is the site root plus its path inside the artifact, so
#    `_site/api.html` is served at `<site>/api.html`. (`deploy-pages`' `page_url`
#    output is always the site root — it is the environment link, not a target.)
#
# Repo prerequisite: Settings → Pages → Source must be **GitHub Actions**. While
# it is left on the legacy "deploy from a branch" mode, `deploy-pages` still
# reports success but the live site keeps being built from the branch instead,
# so a green run is not evidence that this workflow published anything.

on:
  push:
    branches:
      - main
    paths:
      - 'openapi/openapi.json'
      - 'README.md'
      - 'demo.html'
      - 'docs/img/**'
      - '.github/workflows/api-docs.yml'
  workflow_dispatch:
    inputs:
      demo_release_tag:
        description: >-
          Release tag to pull the demo recordings (*.mp4) from. Leave blank
          to use the most recently published release — see "Pull the demo
          recordings into the site" below.
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize deployments; let an in-flight publish finish rather than cancelling
# it, so the live site is never left mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site and API reference
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Build the Jekyll site
        # Same build legacy branch mode ran, so the homepage is unchanged.
        uses: actions/jekyll-build-pages@v1
        with:
          source: .
          destination: ./_site

      - name: Setup Node.js
        uses: actions/setup-node@v6

      - name: Build Redoc API reference into the site
        run: |
          # jekyll-build-pages is a Docker container action, so it runs as root
          # and leaves _site owned by root; this step runs as `runner` and would
          # otherwise fail with EACCES writing into it.
          sudo chown -R "$(id -u):$(id -g)" _site
          npx --yes @redocly/cli build-docs openapi/openapi.json --output=_site/api.html

      - name: Pull the demo recordings into the site
        # The recordings are release assets, not repository files: a 9 MB video
        # does not belong in a 3.8 MB history with no LFS (ADR 0086). They are
        # fetched on every build because Actions-based Pages replaces the whole
        # site each deploy — there is no incremental upload to add them to.
        #
        # Publishing a *new* recording therefore means uploading its MP4s to a
        # release — the latest one, ordinarily — and running this workflow by
        # hand: re-uploading an asset changes no path in the `paths:` filter
        # above, so nothing triggers on its own.
        #
        # Defaults to the most recently *published* release, not GitHub's
        # notion of "latest": every release here is deliberately marked a
        # pre-release (ADR 0086, so a video-only or demo release never wears
        # the "Latest" badge on a version that isn't), and the `/releases/
        # latest` API — which `gh release download`/`gh release view` use
        # with no tag argument — excludes pre-releases and 404s when every
        # release is one. `gh release list`'s default sort does not exclude
        # them, so it is what resolves "latest" here. A manual run can name a
        # specific release instead via the `demo_release_tag`
        # workflow_dispatch input — e.g. to pull last month's recording back
        # onto the site, or preview one attached to a release that isn't the
        # newest.
        env:
          GH_TOKEN: ${{ github.token }}
          DEMO_RELEASE_TAG: ${{ inputs.demo_release_tag }}
        run: |
          mkdir -p _site/demo
          tag="$DEMO_RELEASE_TAG"
          if [ -n "$tag" ]; then
            echo "Pulling demo recordings from release $tag (manual override)"
          else
            tag="$(gh release list --repo "${{ github.repository }}" \
              --exclude-drafts --limit 1 --json tagName -q '.[0].tagName')"
            [ -n "$tag" ] || { echo "::error::no releases found on ${{ github.repository }} to pull demo recordings from"; exit 1; }
            echo "Pulling demo recordings from $tag (most recently published release)"
          fi
          gh release download "$tag" \
            --repo "${{ github.repository }}" \
            --pattern '*.mp4' \
            --dir _site/demo

      - name: Check the site has both pages
        # Cheap guard against the silent-success failure mode this workflow has
        # already hit twice: a deploy step that "succeeds" while publishing the
        # wrong thing. Fail here instead of shipping a broken site.
        run: |
          test -s _site/index.html || { echo "::error::_site/index.html missing — the homepage would 404"; exit 1; }
          test -s _site/api.html   || { echo "::error::_site/api.html missing — the API reference was not generated"; exit 1; }
          test -s _site/demo.html  || { echo "::error::_site/demo.html missing — Jekyll swallowed it instead of copying it"; exit 1; }
          test -s _site/demo/tui-demo.mp4 || { echo "::error::_site/demo/tui-demo.mp4 missing — the release asset was not downloaded, so the demo page would show a broken player"; exit 1; }
          test -s _site/demo/web-demo-desktop.mp4 || { echo "::error::_site/demo/web-demo-desktop.mp4 missing — the release asset was not downloaded, so the demo page would show a broken player"; exit 1; }
          test -s _site/demo/web-demo-mobile.mp4 || { echo "::error::_site/demo/web-demo-mobile.mp4 missing — the release asset was not downloaded, so the demo page would show a broken player"; exit 1; }

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
