name: smoke

# S1 black-box smoke coverage, split by what each lane costs.
#
# `stub` is the cheap one: it builds axon-tui and axon-smoke-tui and drives the
# real TUI over a PTY against an in-process stub. No Docker, no Synapse, no
# Postgres — measured at ~90s cold and ~45s warm, cheaper than the web-e2e
# lanes that already gate pull requests. So it gates them too.
#
# `true-local` needs a real local Synapse stack and takes minutes, so it runs
# after a change lands on main, plus nightly. That is late enough to let a
# regression through; the honest alternative — blocking every PR on a Docker
# stack — costs more than it saves at this size.
#
# Before this split the whole gate was workflow_dispatch-only, so nothing ran
# it automatically and `scroll_pin_on_relation_refresh` sat broken on main long
# enough that its start could not be dated (#190).

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # 04:17 UTC — off the hour, so this does not queue behind everything else
    # scheduled at :00.
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      lane:
        description: Which lane to run by hand
        type: choice
        default: all
        options:
          - tui
          - tui-true-local
          - server
          - all

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Gates pull requests. Keep this job free of Docker and of anything needing a
  # network service, or it stops being cheap enough to block on.
  stub:
    if: github.event_name != 'workflow_dispatch' || inputs.lane == 'tui' || inputs.lane == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-smoke-stub-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-smoke-stub-

      - name: TUI smoke against the in-process stub
        run: ./scripts/smoke-gate.sh tui

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-artifacts-stub
          path: smoke-artifacts/
          if-no-files-found: ignore

  # Does not gate pull requests: needs Docker and a real Synapse.
  true-local:
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.lane != 'tui')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-smoke-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-smoke-

      - name: Resolve smoke lane
        id: lane
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_LANE: ${{ inputs.lane }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            lane="$DISPATCH_LANE"
          else
            lane="all"
          fi
          echo "lane=$lane" >> "$GITHUB_OUTPUT"

      - name: Run the requested lane
        # A dispatch names its lane; a push or a schedule runs everything, which
        # re-runs the stub lane too. That overlap is deliberate: `all` is the
        # documented S1 gate, and carving it up here would create a second
        # definition of what S1 means.
        env:
          SMOKE_LANE: ${{ steps.lane.outputs.lane }}
        run: ./scripts/smoke-gate.sh "$SMOKE_LANE"

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-artifacts-true-local
          path: smoke-artifacts/
          if-no-files-found: ignore

      - name: Notify axon-developer room of result
        if: ${{ always() }}
        continue-on-error: true
        env:
          NOTIFY_HOMESERVER: ${{ secrets.NOTIFY_HOMESERVER }}
          NOTIFY_ROOM: ${{ secrets.NOTIFY_ROOM }}
          NOTIFY_TOKEN: ${{ secrets.NOTIFY_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          TRIGGER: ${{ github.event_name }}
          LANE: ${{ steps.lane.outputs.lane }}
          COMMIT: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          STATUS: ${{ job.status }}
        run: |
          set -euo pipefail

          fields="$(jq -n \
            --arg branch "$BRANCH" \
            --arg trigger "$TRIGGER" \
            --arg lane "$LANE" \
            --arg commit "$COMMIT" \
            --arg actor "$ACTOR" \
            --arg run_url "$RUN_URL" \
            --arg attempt "$ATTEMPT" \
            --arg status "$STATUS" \
            '{
              body: (
                "Smoke Test Run"
                + "\n\ntrue-local " + $status
                + "\n\nBranch: " + $branch
                + "\nTrigger: " + $trigger
                + "\nLane: " + $lane
                + "\nCommit: " + $commit
                + "\nActor: " + $actor
                + "\nAttempt: " + $attempt
                + "\nRun: " + $run_url
              ),
              formatted_body: (
                def html_escape:
                  gsub("&"; "&amp;")
                  | gsub("<"; "&lt;")
                  | gsub(">"; "&gt;")
                  | gsub("\u0022"; "&quot;")
                  | gsub("\u0027"; "&#39;");
                "<h1>Smoke Test Run</h1>"
                + "<h2>true-local <strong>" + ($status | html_escape) + "</strong></h2>"
                + "<p><strong>Branch:</strong> " + ($branch | html_escape)
                + "<br><strong>Trigger:</strong> " + ($trigger | html_escape)
                + "<br><strong>Lane:</strong> " + ($lane | html_escape)
                + "<br><strong>Commit:</strong> " + ($commit | html_escape)
                + "<br><strong>Actor:</strong> " + ($actor | html_escape)
                + "<br><strong>Attempt:</strong> " + ($attempt | html_escape)
                + "<br><strong>Run:</strong> <a href=\"" + ($run_url | html_escape) + "\">"
                + ($run_url | html_escape) + "</a></p>"
              )
            }')"

          MATRIX_BODY="$(jq -r .body <<<"$fields")"
          MATRIX_FORMATTED_BODY="$(jq -r .formatted_body <<<"$fields")"
          export MATRIX_BODY MATRIX_FORMATTED_BODY
          ./scripts/send-matrix-notification.sh
