name: Integration test

# End-to-end test of the M3c re-decryption queue and encrypted media proxy
# against a real Synapse. It's slower than the unit/lint lane (it pulls Synapse
# + Postgres images and runs a full seed → sync → recover → media-fetch flow),
# so it lives in its own workflow rather than gating every push.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # The script brings up Postgres + Synapse via docker compose itself; the
      # GitHub runner already has docker, docker compose, python3, and curl.
      # Default ports (5432/8008) are free on the runner, so no overrides needed.
      - name: Run integration test
        run: scripts/integration-test.sh
        env:
          TIMEOUT: 180
