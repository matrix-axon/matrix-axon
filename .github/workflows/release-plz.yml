name: Release-plz

# Opens and updates the "release vX.Y.Z" PR on every push to main, and tags
# the merge of that PR as vX.Y.Z (ADR 0106, release-plz.toml).
#
# That tag push is what starts cross-build.yml, package.yml,
# desktop-build.yml and publish-images.yml, and the release PR needs the
# pull_request gates like any other. GitHub starts no workflow for a tag or
# PR created with GITHUB_TOKEN, so both jobs use RELEASE_PLZ_TOKEN instead:
# a fine-grained PAT on this repository with Contents and Pull requests
# read/write.

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # One check for both jobs below. Without the PAT, release's tag would
  # start no release builds and release-pr's PR would get no CI.
  token:
    name: Require RELEASE_PLZ_TOKEN
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'matrix-axon/matrix-axon' }}
    steps:
      - name: Require RELEASE_PLZ_TOKEN
        env:
          RELEASE_PLZ_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          if [ -z "$RELEASE_PLZ_TOKEN" ]; then
            echo "::error::RELEASE_PLZ_TOKEN is not set. release-plz's tags and PRs would start no workflows with GITHUB_TOKEN." >&2
            exit 1
          fi

  release:
    name: Tag a merged release PR
    runs-on: ubuntu-latest
    needs: token
    # Two release-PR merges close together must not tag concurrently.
    # A separate group from release-pr's: sharing one would let a queued
    # run cancel the other job's pending run.
    concurrency:
      group: release-plz-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      # Full history: release-plz reads the v* tags to find the last release.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # release_always = false: a push that is not a release PR's merge
      # tags nothing.
      - name: Tag the release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  release-pr:
    name: Open or update the release PR
    runs-on: ubuntu-latest
    # After release, not beside it. On a release PR's merge, this job must
    # see the tag release just created; run in parallel, it compared
    # against the previous tag and opened a second, empty release PR
    # (v0.1.1's merge produced a v0.1.2 PR).
    needs: [token, release]
    # Two pushes close together must not both rewrite the release branch.
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # A run for an older push can reach this job after a later push (a
      # release PR's merge) has landed. Its checkout still predates the new
      # tag and the merged PR, so it would open a second PR for the release
      # just made (v0.1.5's merge produced a second v0.1.5 PR, #593). The
      # later push has its own run, queued behind this one by the
      # concurrency group, so skipping loses little. The skipped run reports
      # green, so if the newer run's token or release job fails, no release
      # PR is opened until a later push or a manual re-run. A merge landing
      # after this check can still race (#608).
      - name: Skip when main has moved on
        id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/${GITHUB_REF_NAME}" --jq .sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::$GITHUB_REF_NAME is at $head, not $GITHUB_SHA; the run for that push opens the release PR."
            echo "stale=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Install Rust toolchain
        if: steps.fresh.outputs.stale != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Open or update the release PR
        if: steps.fresh.outputs.stale != 'true'
        id: release-pr
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

      # release-plz bumps Cargo versions only. The web client's package.json is
      # what every desktop, store and Android bundle ships, so it has to move
      # with them (scripts/bundle-version.sh; package.yml fails a PR where it
      # does not). It is folded into release-plz's own commit, not added as a
      # second one, so the branch stays the single commit release-plz wrote and
      # authored: release-plz leaves a PR alone once someone else has committed
      # to it. The push uses the PAT, so the PR's checks run again on it.
      #
      # No PR (nothing to release) leaves `prs` empty and skips the step. A PR
      # reported without a `head_branch` fails it, loudly: skipping quietly would
      # let a schema change in the action ship a release with a stale package.json.
      - name: Carry the bundle version into the release PR
        if: steps.fresh.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          PRS: ${{ steps.release-pr.outputs.prs }}
        run: |
          if [ "$(printf '%s' "${PRS:-[]}" | jq 'length')" = 0 ]; then
            echo "No release PR was opened or updated; nothing to carry."
            exit 0
          fi
          branch=$(printf '%s' "$PRS" | jq -r '.[0].head_branch // empty')
          if [ -z "$branch" ]; then
            echo "::error::release-plz reported a release PR but its output has no head_branch, so the bundle version was not carried into it. prs=$PRS" >&2
            exit 1
          fi
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin "$branch"
          git checkout -B "$branch" FETCH_HEAD
          scripts/bundle-version.sh sync
          if git diff --quiet -- clients/web/package.json; then
            echo "package.json already matches."
            exit 0
          fi
          git -c user.name=release-plz -c user.email=release-plz@users.noreply.github.com \
            commit --amend --no-edit --quiet -- clients/web/package.json
          git push --force-with-lease="$branch:$(git rev-parse FETCH_HEAD)" origin "$branch"
