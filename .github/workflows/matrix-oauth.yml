name: Matrix OAuth QR integration

on:
  workflow_call:
    inputs:
      suite:
        description: Matrix OAuth QR suite or lane to run
        required: true
        type: string
      notify:
        description: Notify the developer room when the suite finishes
        default: false
        type: boolean
    secrets:
      NOTIFY_URL:
        required: false
      NOTIFY_TOKEN:
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  matrix-oauth:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-matrix-oauth-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-matrix-oauth-

      - name: Run Matrix OAuth QR interoperability
        env:
          MATRIX_OAUTH_SUITE: ${{ inputs.suite }}
        run: |
          case "$MATRIX_OAUTH_SUITE" in
            matrix-oauth-api) lanes=(api) ;;
            matrix-oauth-acquire) lanes=(acquire) ;;
            matrix-oauth-grant) lanes=(grant) ;;
            matrix-oauth-unsupported) lanes=(unsupported) ;;
            matrix-oauth-all|all) lanes=(api acquire grant unsupported) ;;
            *) echo "unknown Matrix OAuth suite" >&2; exit 2 ;;
          esac
          failed=0
          for lane in "${lanes[@]}"; do
            if ! scripts/matrix-oauth-test.sh "$lane"; then
              echo "::error title=Matrix OAuth QR integration::$lane lane failed"
              failed=1
            fi
          done
          exit "$failed"

      # OAuth and encryption secrets exist only in the harness's throwaway
      # directory. Never upload failure artifacts from this job.
      - name: Notify axon-developer room of result
        if: ${{ always() && inputs.notify }}
        continue-on-error: true
        env:
          NOTIFY_URL: ${{ secrets.NOTIFY_URL }}
          NOTIFY_TOKEN: ${{ secrets.NOTIFY_TOKEN }}
          SMOKE_LANE: ${{ inputs.suite }}
          JOB_LABEL: matrix-oauth
          STATUS: ${{ job.status }}
        run: ./scripts/notify-smoke-result.sh
