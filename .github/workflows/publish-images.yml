name: Publish images

# Build + push the axon-server and axon-web images to GHCR for beta distribution
# (ADR 0052). Runs on ubuntu-latest (GitHub-hosted, free minutes on this public
# repo), so a push trigger is fine per AGENTS.md.
# Images are PUBLIC (no credentials needed to pull) — set that once by hand in
# the org's Packages settings for axon-server/axon-web (GHCR defaults new
# packages to private, and this workflow's GITHUB_TOKEN can't change visibility
# itself); the images link to this repo via the Dockerfiles' image.source label.
#
# Trigger by hand (Actions → Publish images → Run workflow) or by pushing a
# `beta-*` tag.
#
# Builds are amd64-only by default. arm64 has to be emulated through QEMU on an
# x86 runner, and a release `cargo build` is pure CPU work — the worst case for
# emulation, commonly 5-15x slower than native. Multi-arch runs were taking over
# two hours. To publish arm64 as well, dispatch with
# platforms = linux/amd64,linux/arm64 and expect it to be slow; the durable fix
# is a native arm64 runner (ubuntu-24.04-arm) with a manifest merge.
#
# The layer cache below matters because the Dockerfile's BuildKit cache mounts
# (cargo registry + target/) do NOT survive on an ephemeral runner the way they
# did on the old self-hosted builder — nothing exports them. `type=gha` caches
# image *layers* instead, which pays off most when the sources are unchanged:
# re-running after a failed push (e.g. a GHCR permissions fix) reuses the build
# outright. A source change still invalidates `COPY . .` and recompiles the
# workspace; making that incremental needs a dependency pre-build stage
# (cargo-chef or manifest-only layer) in the Dockerfile.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Moving tag to publish (e.g. beta, rc1)"
        type: string
        default: beta
      platforms:
        description: "buildx platforms (adding linux/arm64 emulates via QEMU — hours, not minutes)"
        type: string
        default: linux/amd64
  push:
    tags:
      - 'v*' 
      - 'beta-*'
      - 'alpha-*'

env:
  # Pin JS actions (docker/*) to Node 24 (matches cross-build.yml).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute registry, tag, and hash
        id: meta
        shell: bash
        run: |
          # GHCR requires a lowercase owner; fork-friendly (publishes to the
          # fork owner's namespace, burning their own quota, off matrix-axon).
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          hash="$(git rev-parse --short HEAD)"
          if [ "${{ github.event_name }}" = "push" ]; then
            moving="${GITHUB_REF_NAME#beta-}"   # tag `beta-rc1` -> `rc1`
            [ -n "$moving" ] && [ "$moving" != "${GITHUB_REF_NAME}" ] || moving="beta"
          else
            moving="${{ inputs.tag }}"
          fi
          {
            echo "registry=$registry"
            echo "hash=$hash"
            echo "moving=$moving"
            echo "platforms=${{ inputs.platforms || 'linux/amd64' }}"
          } >> "$GITHUB_OUTPUT"

      # Only needed when a build actually targets a non-native architecture;
      # installing binfmt handlers for an amd64-only build is pure overhead.
      - uses: docker/setup-qemu-action@v3
        if: contains(steps.meta.outputs.platforms, 'arm')
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push axon-server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ steps.meta.outputs.platforms }}
          push: true
          build-args: |
            GIT_HASH=${{ steps.meta.outputs.hash }}
          tags: |
            ${{ steps.meta.outputs.registry }}/axon-server:${{ steps.meta.outputs.moving }}
            ${{ steps.meta.outputs.registry }}/axon-server:${{ steps.meta.outputs.hash }}
          # Scoped so the two images don't evict each other from the shared
          # Actions cache. mode=max keeps intermediate stages, not just the
          # final layer, which is what makes the builder stage reusable.
          cache-from: type=gha,scope=axon-server
          cache-to: type=gha,mode=max,scope=axon-server

      - name: Build + push axon-web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web/Dockerfile
          platforms: ${{ steps.meta.outputs.platforms }}
          push: true
          build-args: |
            GIT_HASH=${{ steps.meta.outputs.hash }}
          tags: |
            ${{ steps.meta.outputs.registry }}/axon-web:${{ steps.meta.outputs.moving }}
            ${{ steps.meta.outputs.registry }}/axon-web:${{ steps.meta.outputs.hash }}
          cache-from: type=gha,scope=axon-web
          cache-to: type=gha,mode=max,scope=axon-web
