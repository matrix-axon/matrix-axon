name: Web e2e

# The M-W6 Playwright lane (ADR 0061): headless Chromium drives the built app
# against the dependency-free mock backend in `clients/web/e2e/mock-server.mjs`.
# `pnpm test:e2e` runs the same thing locally.
#
# This lane gates web PRs. It was dispatch-only on the grounds that it needs a
# browser runner, but `ubuntu-latest` provides one and `playwright install
# --with-deps chromium` is the whole cost; the suite is ~40 s of test time. The
# price of not running it is what issue #96 documents: three real failures sat
# on `main` from the PR that introduced them, because nothing ever ran them.
#
# Paths mirror `web-lint-and-test.yml`, minus its `openapi/openapi.json` entry —
# that is there for the schema-drift gate, which this lane does not run. A
# server-silo PR cannot break these tests without touching `clients/web`.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "clients/web/**"
      - ".github/workflows/web-e2e.yml"
  pull_request:
    paths:
      - "clients/web/**"
      - ".github/workflows/web-e2e.yml"

# A browser lane is the most expensive thing here, and only the newest commit
# on a branch is worth a runner.
concurrency:
  group: web-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  web-e2e:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: clients/web

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: clients/web/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: clients/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The mock backend serves `dist/`, so the app must be built before the
      # lane runs; Playwright's webServer only starts the mock.
      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e lane
        run: pnpm test:e2e

      # The CI reporter is `github` (inline annotations), so the artifact worth
      # keeping is the trace `retries: 1` captures on a first-attempt failure.
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-traces
          path: clients/web/test-results/
          retention-days: 7
          if-no-files-found: ignore
