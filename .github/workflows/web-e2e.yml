name: Web e2e

# The M-W6 Playwright lane (ADR 0061): desktop Chromium, Firefox, and WebKit
# drive the built app against the dependency-free mock backend in
# `clients/web/e2e/mock-server.mjs`. `pnpm test:e2e` remains the local
# Chromium default.
#
# This lane gates web PRs. It was dispatch-only on the grounds that it needs a
# browser runner, but `ubuntu-latest` provides one and Playwright installs its
# own browser dependencies. The price of not running it is what issue #96
# documents: three real failures sat on `main` from the PR that introduced
# them, because nothing ever ran them.
#
# Paths mirror `web-lint-and-test.yml`, minus its `openapi/openapi.json` entry —
# that is there for the schema-drift gate, which this lane does not run. A
# server-silo PR cannot break these tests without touching `clients/web`.

on:
  workflow_dispatch:
    inputs:
      projects:
        description: "Which e2e project(s) to run"
        required: false
        default: all
        type: choice
        options:
          - all
          - chromium
          - firefox
          - webkit-desktop
          - webkit-iphone
  push:
    branches:
      - main
    paths:
      - "clients/web/**"
      - ".github/workflows/web-e2e.yml"
  pull_request:
    paths:
      - "clients/web/**"
      - ".github/workflows/web-e2e.yml"

permissions:
  contents: read

# A browser lane is the most expensive thing here, and only the newest commit
# on a branch is worth a runner.
concurrency:
  group: web-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # `jobs.<job_id>.if` can't see the `matrix` context — the condition decides
  # whether the whole matrix job runs at all, before that matrix is expanded —
  # so a manual single-project pick has to narrow the matrix itself instead of
  # filtering it via `if`. This job computes that matrix once, up front.
  resolve-matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.resolve.outputs.include }}
    steps:
      - id: resolve
        run: |
          full='[{"project":"chromium","browser":"chromium"},{"project":"firefox","browser":"firefox"},{"project":"webkit-desktop","browser":"webkit"}]'
          selected="${{ github.event.inputs.projects }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$selected" ] && [ "$selected" != "all" ]; then
            include=$(echo "$full" | jq -c --arg project "$selected" '[.[] | select(.project == $project)]')
          else
            include="$full"
          fi
          echo "include=$include" >> "$GITHUB_OUTPUT"

  web-e2e:
    needs: resolve-matrix
    # Empty when a manual dispatch picked `webkit-iphone` alone — an empty
    # `strategy.matrix.include` is a hard error, so skip the job outright
    # rather than let it try to expand a zero-entry matrix.
    if: needs.resolve-matrix.outputs.include != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.resolve-matrix.outputs.include) }}

    defaults:
      run:
        working-directory: clients/web

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: clients/web/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: clients/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The mock backend serves `dist/`, so the app must be built before the
      # lane runs; Playwright's webServer only starts the mock.
      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Run ${{ matrix.project }} e2e lane
        run: pnpm exec playwright test --project=${{ matrix.project }} --fail-on-flaky-tests

      # The CI reporter is `github` (inline annotations), so the artifact worth
      # keeping is the trace `retries: 1` captures on a first-attempt failure.
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-traces-${{ matrix.project }}
          path: clients/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  web-e2e-iphone:
    # Runs on the main push gate as before, plus manual dispatch when the
    # `projects` input asks for it (either `all` or the lane by name).
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.projects == 'all' || github.event.inputs.projects == 'webkit-iphone'))
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: clients/web

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: clients/web/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: clients/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Install Playwright WebKit
        run: pnpm exec playwright install --with-deps webkit

      - name: Run iPhone-profile WebKit e2e lane
        run: MOBILE_E2E=1 pnpm exec playwright test --project=webkit-iphone --fail-on-flaky-tests

      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-traces-webkit-iphone
          path: clients/web/test-results/
          retention-days: 7
          if-no-files-found: ignore
