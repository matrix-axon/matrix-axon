name: iOS sharing
on:
  pull_request:
    paths: &sharing-paths
      - clients/web/src-tauri/incoming-share/**
      - clients/web/src-tauri/share-probe/**
      - clients/web/src-tauri/share-extension/**
      - clients/web/src-tauri/share-extension-tests/**
      - clients/web/scripts/ios-share-activation.json
      - clients/web/scripts/configure-ios-sharing.mjs
      - clients/web/scripts/check-ios-sharing.py
      - clients/web/src-tauri/native-auth/ios/**
      - clients/web/src/incoming-share/fixtures/**
      - clients/web/scripts/share-contract.mjs
      - clients/web/scripts/test-sharing-simulator.mjs
      - openapi/openapi.json
      - crates/axon-core/src/link_preview.rs
      - crates/axon-api/tests/fixtures/*preview*.json
      - .github/workflows/ios-sharing.yml
  push:
    branches: [main]
    paths: *sharing-paths
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Check OpenAPI and server validation policy drift
        run: node clients/web/scripts/share-contract.mjs
      - name: Swift ownership, recovery, and portable server contracts
        run: swift test --package-path clients/web/src-tauri/incoming-share
      - name: Install simulator test project generator
        run: brew install xcodegen
      - name: Run native tests and real share-sheet activation under iOS Simulator
        run: node clients/web/scripts/test-sharing-simulator.mjs
      - name: Compile shared module with iOS extension API restrictions
        working-directory: clients/web/src-tauri/incoming-share
        run: |
          output=$(mktemp -d)
          xcodebuild -scheme AxonIncomingShare -destination 'generic/platform=iOS' \
            -derivedDataPath "$output" APPLICATION_EXTENSION_API_ONLY=YES \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 CODE_SIGNING_ALLOWED=NO build
