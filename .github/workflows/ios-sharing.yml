name: iOS sharing
on:
  pull_request:
    paths: &sharing-paths
      - clients/web/src-tauri/incoming-share/**
      - clients/web/src-tauri/share-probe/**
      - clients/web/src-tauri/share-extension/**
      - clients/web/src-tauri/share-extension-tests/**
      - clients/web/scripts/ios-share-activation.json
      - clients/web/scripts/configure-ios-sharing.mjs
      - clients/web/scripts/test-ios-sharing-signing.mjs
      - clients/web/scripts/check-ios-sharing.py
      - clients/web/src-tauri/native-auth/ios/**
      - clients/web/src/incoming-share/fixtures/**
      - clients/web/scripts/share-contract.mjs
      - clients/web/scripts/test-sharing-simulator.mjs
      - clients/web/scripts/sharing-diagnostics.mjs
      - clients/web/scripts/test-sharing-diagnostics.mjs
      - clients/web/scripts/sharing-simulator-device.mjs
      - clients/web/scripts/test-sharing-simulator-device.mjs
      - clients/web/scripts/ios-minimum-version.mjs
      - clients/web/scripts/test-ios-minimum-version.mjs
      - clients/web/scripts/is-entry-point.mjs
      - clients/web/scripts/test-is-entry-point.mjs
      - openapi/openapi.json
      - crates/axon-core/src/link_preview.rs
      - crates/axon-api/tests/fixtures/*preview*.json
      - .github/workflows/ios-sharing.yml
  push:
    branches: [main]
    paths: *sharing-paths
  workflow_dispatch:
permissions:
  contents: read
# A newer push to the same PR makes the older macOS run moot. Every other run
# gets its own group, because a shared group would still replace a pending run.
concurrency:
  group: ios-sharing-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  native:
    runs-on: xcode-27
    # Observed passing runs take 16-35 min; leave room for one xcodegen retry and for the
    # simulator phases running long on a slow runner (15 minutes for the unit phase, 25
    # for the UI phase). A job that times out is cancelled, which skips the step that
    # keeps the diagnostics.
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v7
      # The Xcode is chosen, as the store and launch-check jobs choose it, and not left to
      # whichever the runner image defaults to. The default, 27.1, offered one iPhone
      # simulator, the Duo, whose short screen scrolls the composer's header away; the
      # launch check on 27.2 ran on a standard-size iPhone.
      - name: Select an Xcode with the iOS 26 SDK, system-wide as well
        run: scripts/ci/store-credentials.sh xcode --min-sdk 26
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Check OpenAPI and server validation policy drift
        run: node clients/web/scripts/share-contract.mjs
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: clients/web/package.json
      - name: Install generator dependencies
        run: pnpm --dir clients/web install --frozen-lockfile
      - name: Check archive and export signing selection
        run: node --test clients/web/scripts/test-ios-sharing-signing.mjs clients/web/scripts/test-sharing-diagnostics.mjs clients/web/scripts/test-sharing-simulator-device.mjs clients/web/scripts/test-ios-minimum-version.mjs clients/web/scripts/test-is-entry-point.mjs
      - name: Swift ownership, recovery, and portable server contracts
        run: swift test --package-path clients/web/src-tauri/incoming-share
      - name: Install simulator test project generator
        run: brew install xcodegen
      # A failed run keeps its result bundles and the crash reports it wrote in this
      # folder; the next step uploads them. The log alone says only that the host app
      # "crashed".
      - name: Run native tests and real share-sheet activation under iOS Simulator
        env:
          AXON_SHARING_DIAGNOSTICS: ${{ runner.temp }}/sharing-diagnostics
        run: node clients/web/scripts/test-sharing-simulator.mjs
      - name: Keep the simulator results of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-sharing-diagnostics
          path: ${{ runner.temp }}/sharing-diagnostics
          if-no-files-found: ignore
          retention-days: 7
      - name: Compile shared module with iOS extension API restrictions
        working-directory: clients/web/src-tauri/incoming-share
        run: |
          output=$(mktemp -d)
          xcodebuild -scheme AxonIncomingShare -destination 'generic/platform=iOS' \
            -derivedDataPath "$output" APPLICATION_EXTENSION_API_ONLY=YES \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 CODE_SIGNING_ALLOWED=NO build
