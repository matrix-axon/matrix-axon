name: Check environment
description: "Checks for disk space and optionally docker"

inputs:
  require-docker:
    description: "Also verify the runner's Docker daemon is reachable"
    required: false
    default: false
  require-commands:
    description: >-
      Space-separated commands the job needs from the machine rather than from a
      setup action. GitHub's hosted images ship them all; a self-hosted runner
      must have them installed (ADR 0141, decision 6). The job fails at once with
      the list of what is missing, instead of minutes later at the first use.
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: test environment
      shell: bash
      run: whoami

    - name: Required commands
      shell: bash
      if: ${{ inputs.require-commands != '' }}
      env:
        REQUIRED: ${{ inputs.require-commands }}
      run: |
        missing=()
        for c in $REQUIRED; do
          command -v "$c" >/dev/null 2>&1 || missing+=("$c")
        done
        if ((${#missing[@]} > 0)); then
          echo "::error title=Missing commands::this runner lacks: ${missing[*]}. A self-hosted runner needs them installed; see docs/self-hosted-runners.md."
          exit 1
        fi
        echo "All required commands present: $REQUIRED"

    - name: Docker access check
      shell: bash
      if: ${{ inputs.require-docker == 'true' }}
      run: docker run --rm hello-world

    - name: Assert Minimum Disk Space
      shell: bash
      run: |
        AVAILABLE_GB=$(df -h . | awk 'NR==2 {print $4}' | sed 's/Gi*//')
        REQUIRED_GB=15

        echo "Available space: ${AVAILABLE_GB} GB"
        echo "Required space: ${REQUIRED_GB} GB"

        if [ "$AVAILABLE_GB" -lt "$REQUIRED_GB" ]; then
          echo "❌ Error: Insufficient disk space available on the runner."
          exit 1
        fi
        echo "✅ Sufficient disk space verified."
