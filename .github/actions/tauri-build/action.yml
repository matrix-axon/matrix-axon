name: Build the Tauri bundles
description: >-
  Runs `pnpm tauri build` in clients/web with every empty signing credential
  unset, so a secret that does not exist yields an unsigned bundle rather than
  a failed signing step.

inputs:
  args:
    description: "Extra arguments for `tauri build`, e.g. `--target universal-apple-darwin`"
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Bundle filenames, the OS-level version metadata, and the version the app
    # shows all come from `version` in `clients/web/package.json` —
    # `tauri.conf.json` reads it by path, and `vite.config.ts` derives RELEASE
    # and `version.json` from the same field.
    #
    # Left alone it is whatever was last committed, which is not the release
    # being built: tag v0.0.12 shipped `Axon_0.1.0_universal.dmg`, an artifact
    # that misreports which release it belongs to, in three places at once.
    #
    # Only `v<semver>` tags are taken. `alpha-*` and `beta-*` are not semver,
    # and both Tauri's config schema and CFBundleShortVersionString require
    # one, so those keep the committed version rather than failing the build.
    # Pull-request runs keep it too — nothing there is released.
    #
    # Written into the runner's checkout and never committed. This runs after
    # `pnpm install`, so no lockfile check sees the edit.
    - name: Take the bundle version from the tag
      shell: bash
      working-directory: clients/web
      run: |
        if [ "${GITHUB_REF_TYPE:-}" != "tag" ]; then
          echo "Not a tag build; keeping the committed version."
          exit 0
        fi
        version="${GITHUB_REF_NAME#v}"
        if [ "$version" = "$GITHUB_REF_NAME" ] ||
           ! printf '%s' "$version" |
             grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
          echo "::notice::$GITHUB_REF_NAME is not a v<semver> tag; keeping the committed version."
          exit 0
        fi
        node -e '
          const fs = require("node:fs")
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"))
          pkg.version = process.argv[1]
          fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n")
        ' "$version"
        echo "Bundle version set to $version."

    # One copy of this for all three platforms, because the rule is the same on
    # each and the list of variables has to be edited in one place.
    #
    # **Signing is by presence, not by branching** (desktop-build.yml's header).
    # GitHub materializes a *missing* secret as an empty string, not as an
    # absent variable — and Tauri tests whether these are set, not whether they
    # hold anything. Left as empty strings they select the signing path, which
    # then fails partway through: on macOS in `security import` with no
    # certificate to import, for the updater in parsing an empty key. Unsetting
    # them here is what makes "unsigned when there is nothing to sign with"
    # actually true; a step's `env:` cannot express "omit this key".
    #
    # The list is every credential any platform's build reads, not only the
    # ones a given job sets: the loop is harmless for a variable that was never
    # there, and a per-platform list is what let the earlier copies drift.
    - name: Build bundles
      shell: bash
      working-directory: clients/web
      env:
        TAURI_BUILD_ARGS: ${{ inputs.args }}
      run: |
        for var in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
                   APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD \
                   APPLE_TEAM_ID TAURI_SIGNING_PRIVATE_KEY \
                   TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
          if [ -z "${!var:-}" ]; then unset "$var"; fi
        done
        read -r -a args <<< "$TAURI_BUILD_ARGS"
        pnpm tauri build "${args[@]}"
