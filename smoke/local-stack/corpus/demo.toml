# ---------------------------------------------------------------------------
# Spaces
# ---------------------------------------------------------------------------
# Two spaces so the web Spaces picker has a real choice to filter by, and so
# "All rooms" is meaningfully different from either one. axon-tui has no space
# support (docs/client-parity.md), so these are web-only in the demo.

[[space]]
id = "ridgeline"
name = "Ridgeline Trail Collective"
