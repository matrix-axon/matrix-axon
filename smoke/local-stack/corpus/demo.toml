# Axon demo corpus — Ridgeline Trail Collective
#
# The single source of truth for demo content (ADR 0086). Rendered into a real
# Synapse + axon stack by `axon-smoke-local-stack up --corpus <this file>`;
# both axon-web and axon-tui then read it over /v1/.
#
# Everything here is fictional. Personas, prose, and place names were written
# for this file — no real people, no scraped content.
#
# Conventions
# -----------
# `at`  Relative timestamps, always in the past: "-6d 09:12" means six days
#       before the seeding run, at 09:12 UTC. Relative offsets keep a recording
#       made at any time reading as current, and give /jump, day separators,
#       and search date filters real spread to work against.
# `id`  Optional stable handle so later messages can reference this one via
#       `reply_to` or `thread`. Not a Matrix event ID; the seeder maps it to
#       the real one and publishes the mapping in the run manifest.
#
# Budgets
# -------
# Keep each room under AXON_SYNC__TIMELINE_LIMIT (200) until true historical
# backfill lands (issue 164). Current max is #trail-work at well under half.

[meta]
name = "Ridgeline Trail Collective"
description = "A volunteer trail-maintenance collective and the watershed council it shares members with."
# The account the demo is recorded "as" — whose client we are looking at.
viewer = "alex"

