[package]
name = "axon-smoke-matrix-oauth"
description = "Black-box Matrix OAuth QR interoperability harness for axon-server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# This crate drives the shipped axon-server binary only through /v1/. It uses
# matrix-rust-sdk solely as the independent trusted/fresh Matrix device and
# must never depend on an axon-* product crate.

[[bin]]
name = "axon-smoke-matrix-oauth"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
futures-util = { workspace = true, features = ["std"] }
libc = { workspace = true }
matrix-sdk = { workspace = true, features = [
    "e2e-encryption",
    "bundled-sqlite",
] }
reqwest = { workspace = true, features = ["cookies", "form", "json", "rustls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
uuid = { workspace = true, features = ["v4", "serde"] }
url = { workspace = true }
