# msw's postinstall only prints a support notice; nothing needs building.
allowBuilds:
  msw: false

# Workspace level graph overrides
overrides:
  'openapi-typescript@7.13.0>typescript': '~6.0.3'
  # GHSA-2883-xcg3-v3hh: js-yaml's `maxTotalMergeKeys` did not bound CPU use on
  # a merge-key bomb. Our own dependency is already 4.3.2; this reaches the copy
  # `@redocly/openapi-core` pins, which is a dev-only path (it builds the
  # generated API client) but still runs on developer machines and in CI. A
  # patch bump within the same major, so nothing else moves.
  'js-yaml@<4.3.2': '^4.3.2'
  # CVE-2026-109869: fetch() implementation crashes the Node.js process when a 
  # malicious server returns a response with more than five content codings
  # undici is imported only via the jsdom dev dependency and has a CVE in the 
  # default version. This pin moves undici past the vulnerable version, 
  # allowing packages to pass pnpm audit.
  'undici': '^7.30.1'
  # CVE-2023-54404: Zod can exhaust memory while validating oversized constrained
  # collections. zod is imported via eslint-plugin-react-hooks dev dependency. The
  # default version has a CVE, so this pin most zod past the vulnerable version,
  # allowing the build to pass pnpm audit.
  'zod': '^4.6.7'

# Peer dependency suppression rules
peerDependencyRules:
  allowedVersions:
    typescript: '6.x'
