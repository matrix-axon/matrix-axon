# msw's postinstall only prints a support notice; nothing needs building.
allowBuilds:
  msw: false

# Workspace level graph overrides
#
# Every entry below is a security floor for a transitive dependency. The
# `minimatch` entry is load-bearing: eslint and typescript-estree resolve 10.x
# and `@redocly/openapi-core` pins 5.1.9, all below the fixed version. The
# `js-yaml`, `undici` and `zod` entries are precautionary: the versions they
# would otherwise resolve to are already patched, so they only guard against a
# future re-resolve, or a dependent that starts pinning an older release,
# drifting back to a vulnerable version and failing `pnpm audit`. Remove an
# entry only once nothing in the graph can resolve below its fixed version.
overrides:
  # CVE-2026-118764: minimatch < 11.0.1 contains an attacker-controlled pattern
  # amplification in firstPhasePreProcess() when optimizationLevel >= 2.
  'minimatch': '^11.0.1'
  # GHSA-2883-xcg3-v3hh: js-yaml's `maxTotalMergeKeys` did not bound CPU use on
  # a merge-key bomb. Our own dependency is already 4.3.2, and so is the copy
  # `@redocly/openapi-core` currently pins; this floor covers an older pin in a
  # future redocly release. That path is dev-only (it builds the generated API
  # client) but still runs on developer machines and in CI. A patch bump within
  # the same major, so nothing else moves.
  'js-yaml@<4.3.2': '^4.3.2'
  # CVE-2026-109869: fetch() implementation crashes the Node.js process when a
  # malicious server returns a response with more than five content codings
  # undici is imported only via the jsdom dev dependency and has a CVE in the
  # default version. This pin moves undici past the vulnerable version,
  # allowing packages to pass pnpm audit.
  'undici': '^7.30.1'
  # CVE-2023-54404: Zod can exhaust memory while validating oversized constrained
  # collections. zod is imported via eslint-plugin-react-hooks dev dependency. The
  # default version has a CVE, so this pin most zod past the vulnerable version,
  # allowing the build to pass pnpm audit.
  'zod': '^4.6.7'

# Peer dependency suppression rules
peerDependencyRules:
  allowedVersions:
    typescript: '6.x'
