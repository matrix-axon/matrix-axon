<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      SVG first: a browser that understands it gets the master itself, sharp at
      any tab size and on any display. The PNG stays for those that do not, and
      for the manifest, which has no SVG entry.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icon-152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icon-167.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!--
      `viewport-fit=cover` or iOS lays the page out *inside* the safe areas and
      fills what is left over with the webview's own backdrop — a band along the
      bottom, below the home indicator, that the app appears to stop short of.
      The insets are then given back deliberately in `index.css`; covering
      without them puts content under the status bar and the home indicator.

      Measured in the packaged shell on a phone, and this file is shared with
      the plain web deploy, so the tag reaches an ordinary Safari tab and the
      iOS home-screen PWA too. Both are unmeasured; #459 tracks reading them on
      a notched device. Note the insets are inert without this tag —
      `env(safe-area-inset-*)` is `0px` unless it is set — so the exposure is
      notched iOS in standalone and landscape, not every browser.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Axon" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>axon</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
