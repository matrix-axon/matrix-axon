# The Tauri desktop/mobile shell (ADR 0102, M-W12).
#
# Deliberately its OWN workspace, not a member of the repo root's.
# `.github/workflows/cross-build.yml` runs `cargo build --workspace` on
# ubuntu-latest, windows-latest and macos-latest (both arches), and the
# pre-push gate runs `cargo clippy --all-features --all-targets -- -D warnings`
# and `cargo test --all`. Making this a member would put webkit2gtk on the
# critical path of every one of those lanes, and ask them to build a desktop
# app they have no business building. A separate workspace also keeps this
# crate's lockfile — and the cache key derived from it — away from the server's.
[workspace]

[package]
name = "axon"
# Not the product version, and not what any bundle carries: `tauri.conf.json`
# reads that from `../package.json`. Cargo requires a version here and this
# crate is `publish = false`, so this string appears nowhere but its own
# Cargo.lock. Leave it be when cutting a release.
#
# The product version is the workspace's Cargo version. `../package.json`
# carries it (release-plz.yml folds it into the release PR, and
# `scripts/bundle-version.sh check` fails a PR where the two differ), and the
# shared `.github/actions/tauri-build` step and the store and Android workflows
# re-sync it in the runner's checkout before the build.
version = "0.1.0"
edition = "2021"
# `tauri-plugin-notification` 2.5 requires 1.90. The repo toolchain is 1.96.1
# (`rust-toolchain.toml`). This crate's floor was 1.86, which that plugin rejects.
rust-version = "1.90"
license = "Apache-2.0"
description = "Axon desktop client"
publish = false

[lib]
# Mobile targets link the app as a library; the binary below is desktop's entry.
name = "axon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `generate_context!` expands to `serde_json` paths once tauri.conf.json
# carries a `plugins` section, so it has to be nameable here.
serde_json = "1"
tauri = { version = "2", features = [] }
# Pinned to 2.5.x rather than "2". The Tauri CLI requires the Rust crate and
# its npm counterpart to agree on major.minor, and @tauri-apps/plugin-http
# 2.6.0 is too new for pnpm's minimumReleaseAge supply-chain guard to install
# (published 2026-08-31). Taking 2.6.0 on the npm side means writing a
# minimumReleaseAgeExclude entry, i.e. deliberately installing a hours-old
# package to settle a version-alignment nit. Pinning down here keeps both sides
# on the aged release; lift it once 2.6.0 ages past the threshold.
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "~2.5"
# Same pin shape as http, and the same reason: stay on 2.5 so the Rust crate
# and `@tauri-apps/plugin-notification` agree on major.minor without taking a
# release pnpm's minimumReleaseAge guard will refuse. 2.5 requires Rust 1.90
# (see `rust-version` above) and fixes the Windows permission check that 2.4
# short-circuited to denied.
tauri-plugin-notification = "~2.5"
# In-repo: Sign in with Apple and Keychain token storage on iOS (ADR 0054).
tauri-plugin-native-auth = { path = "native-auth" }
tauri-plugin-opener = "2"
tauri-plugin-websocket = "2"

[dev-dependencies]
# `test` gives a mock runtime, so the asset-resolution rules below can be
# asserted headlessly — no webview, no display.
tauri = { version = "2", features = ["test"] }

# Desktop only: the OS spawns a *new* process for a deep link on Windows and
# Linux, so without this the OAuth callback would arrive in a second instance
# while the PKCE verifier sits in the first one's sessionStorage. The
# `deep-link` feature forwards the URL to the running instance instead.
# Reaching the underlying WebKitGTK view, to answer its permission requests.
# Version and feature pinned to what tauri itself depends on, so the types are
# the same ones `with_webview` hands back rather than a parallel copy.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2", features = ["v2_40"] }

# Reaching AppKit, for the text services a WKWebView app has to switch on
# itself: spell checking while typing (which autocorrect depends on), and the
# Edit menu's Spelling and Substitutions items. Versions match what tauri and
# wry already depend on, so no second copy is built.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSDictionary", "NSString", "NSUserDefaults", "NSValue"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSMenu", "NSMenuItem", "NSResponder"] }

# The iOS home-screen number. `WebviewWindow::set_badge_count` is compiled
# only into Tauri's desktop builds, so an iOS build cannot call it. This is
# the same `objc2` Tao already uses for that call.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
# The badge completion handler is a block. `objc2` encodes a null object and
# a null block differently, and a debug build checks that.
block2 = "0.6"

[target.'cfg(any(windows, target_os = "linux", target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[features]
# Used by `tauri dev` to enable devtools in a release-profile build.
custom-protocol = ["tauri/custom-protocol"]
