"$schema" = "schemas/schema.json"

[default]
description = "Everything the shell's HTTP transport needs: send a request, read or release its body, cancel it, swap in a fresh client after resume, read the connection counters, and tell the `axon-media` scheme which server base its stream tickets belong to (ADR 0139 § 7). Any `http` or `https` URL is reachable (ADR 0127 § 8; narrowing it is issue 893)."
permissions = [
  "allow-send",
  "allow-read-body",
  "allow-cancel",
  "allow-drop-body",
  "allow-reset",
  "allow-stats",
  "allow-set-media-stream-base",
]
