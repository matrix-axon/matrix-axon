# APNs and FCM device tokens for the mobile shell (ADR 0113).
#
# A separate crate only because Tauri compiles a plugin's Swift and Kotlin
# through the plugin's own build script. It lives inside the shell's workspace
# directory, so it is a member of that workspace implicitly and shares its
# lockfile. Never published.
[package]
name = "tauri-plugin-remote-push"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
publish = false
# Required by `tauri-plugin`: the app's build script finds this plugin's
# permission manifests through the `DEP_TAURI_PLUGIN_REMOTE_PUSH_*` variables
# that `links` makes Cargo export.
links = "tauri-plugin-remote-push"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
