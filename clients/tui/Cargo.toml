[package]
name = "axon-tui"
description = "Terminal client for the Axon API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "axon-tui"
path = "src/main.rs"

[build-dependencies]
chrono = { workspace = true, features = ["clock"] }

[dependencies]
anyhow = { workspace = true }
futures-util = { workspace = true, features = ["sink", "std"] }
reqwest = { workspace = true, features = ["json", "query", "rustls", "stream"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { workspace = true, features = ["connect", "rustls-tls-webpki-roots"] }
uuid = { workspace = true, features = ["serde", "v4"] }
zeroize = "1"
ratatui = { workspace = true, features = ["unstable-rendered-line-info"] }
crossterm = { workspace = true }
libc = "0.2"
emojis = "0.8"
ruma = "0.16"
ruma-html = "0.8"
# chafa-dyn (the default) requires libchafa via pkg-config — disable it so the
# build works without that system dependency. crossterm gives the protocol
# implementations for Kitty, Sixel, iTerm2, and halfblocks (the safe fallback).
ratatui-image = { version = "11.0.4", default-features = false, features = ["crossterm"] }
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
kamadak-exif = "0.6"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
html-escape = "0.2"
textwrap = { version = "0.16", default-features = false }
unicode-width = "0.2"
chrono = { workspace = true, features = ["clock"] }
