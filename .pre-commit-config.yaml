# Shared git-hook config for the repo, run at push time.
#
# Purpose: stop cheap, path-filtered CI failures from reaching CI. Web hooks
# mirror web-lint-and-test.yml. Rust hooks run rustfmt and clippy (the same
# commands as lint-and-test.yml / lint-and-clippy.yml) when rust sources
# change. `cargo test --all` stays in `.githooks/pre-push` — it is the
# expensive gate, not a cheap pre-push check.
#
# Works for both VCS front-ends the team uses:
#   * git users:  `pre-commit install --hook-type pre-push`   (fires on `git push`)
#   * jj users:   `jj-hooks --runner pre-commit push`         (git hooks don't fire under jj)
# Both read THIS file; only the driver differs.
#
# These two hook systems do not run together. `./scripts/setup-hooks.sh`
# sets `core.hooksPath = .githooks`, and pre-commit's installer refuses
# to install when that is set (`Cowardly refusing to install hooks with
# core.hooksPath set`). Reverse the order and `setup-hooks.sh` orphans
# the pre-commit hook by taking over hooksPath. jj users are unaffected:
# they push through `jj-hooks`, which reads this file directly. Skipping
# rust here would leave that path with no rustfmt.
#
# The prettier hook is self-contained (`language: node` + pinned
# `additional_dependencies`), so it needs neither the repo's `node_modules`
# nor a global prettier. The pnpm-backed hooks below use the repo's normal
# clients/web dependencies so they match CI; run `pnpm install --frozen-lockfile`
# in clients/web before relying on them locally or through jj-hooks. The
# rust hooks use the repo toolchain (`rust-toolchain.toml`).
#
# Check-only: failures print the same command CI expects locally.
minimum_pre_commit_version: "3.2.0"
repos:
  # actionlint vendors its own binary, so it needs nothing installed -- the same
  # property that makes prettier-web work everywhere. `.github/actionlint.yaml`
  # (the self-hosted runner labels) is picked up from the repo root.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        stages: [pre-push]
  - repo: local
    hooks:
      # Cheapest first: these three are git plumbing and shell, seconds at most,
      # and they fail before anything spends a build on the same push.
      - id: adr-numbers
        name: ADR numbers are unique
        language: system
        entry: scripts/check-adr-numbers.sh
        files: '^docs/adr/'
        pass_filenames: false
        stages: [pre-push]
      - id: migrations-immutable
        name: applied migrations are immutable
        language: system
        # No base ref: the script searches base/main, upstream/main,
        # origin/main, main. `git fetch upstream main` before trusting a clean
        # result -- a lagging fork's main reads as though this branch changed a
        # published migration (AGENTS.md, ADR 0004).
        entry: scripts/check-migrations-immutable.sh
        files: '^crates/axon-store/migrations/'
        pass_filenames: false
        stages: [pre-push]
      - id: prettier-web
        name: prettier (web, check)
        language: node
        additional_dependencies: ["prettier@3.9.4"]
        entry: prettier --check
        # Config (.prettierrc.json) resolves by walking up from each path.
        files: '^(.pre-commit-config.yaml|clients/web/README.md|clients/web/.*\.(ts|tsx|mjs|cjs|js|css|json|md|html|yml|yaml))$'
        # Mirror clients/web/.prettierignore (generated / vendored files).
        exclude: '^clients/web/(dist/|pnpm-lock\.yaml|src/api/schema\.d\.ts|public/emoji-picker-data-en\.json)'
        pass_filenames: true
        stages: [pre-push]
      - id: web-api-schema
        name: web API schema is current
        language: system
        entry: pnpm --dir clients/web check:api
        files: '^(\.github/workflows/web-lint-and-test\.yml|openapi/openapi\.json|clients/web/(package\.json|pnpm-lock\.yaml|scripts/check-api-schema\.mjs|src/api/schema\.d\.ts))$'
        pass_filenames: false
        stages: [pre-push]
      - id: web-lint
        name: web lint
        language: system
        entry: pnpm --dir clients/web lint
        files: &web_sources '^(\.github/workflows/web-lint-and-test\.yml|clients/web/|\.pre-commit-config\.yaml)'
        pass_filenames: false
        stages: [pre-push]
      - id: web-test
        name: web test
        language: system
        entry: pnpm --dir clients/web test
        files: *web_sources
        pass_filenames: false
        stages: [pre-push]
      - id: web-build
        name: web build
        language: system
        entry: pnpm --dir clients/web build
        # Deliberately not *web_sources: the build additionally consumes
        # openapi/openapi.json (via the generated client), which lint and the
        # unit tests do not. A YAML alias cannot extend a scalar, so this one
        # is spelled out -- scripts/check-hook-filters.py pins both shapes.
        files: '^(\.github/workflows/web-lint-and-test\.yml|openapi/openapi\.json|clients/web/|\.pre-commit-config\.yaml)'
        pass_filenames: false
        stages: [pre-push]
      # Workspace members: crates/*, clients/tui, smoke/{tui,server,local-stack}.
      # rustfmt is seconds; clippy matches CI and is the next-cheapest catch.
      #
      # The filter is *.rs, *.toml and *.sql under those trees, not the bare
      # directory prefixes: a full `cargo clippy --all-features --all-targets`
      # is minutes, and a README or a corpus fixture cannot change a
      # compilation unit.
      #
      # Two things here are compile-time file inputs and are in the filter for
      # that reason, not by accident:
      #   * tests/fixtures/ -- axon-sync's redecrypt.rs and backfill.rs
      #     `include_str!` from it, and it lives outside crates/, so the old
      #     directory-prefix filter missed it entirely.
      #   * crates/axon-store/migrations/*.sql -- migrations.rs embeds the
      #     directory with `include_dir!` (NOT sqlx::migrate!, which would drag
      #     sqlx-sqlite in and collide with matrix-sdk's rusqlite). A .sql edit
      #     changes the embedded checksums that axon-server reads and that
      #     axon-store's tests assert on. Grepping only for include_str!/
      #     migrate! misses this; check for include_dir! too.
      # Beyond those: no sqlx::query! macros, no .sqlx offline data, and both
      # build.rs files read only env vars and git/jj output. If that changes,
      # widen this in the same commit -- scripts/check-hook-filters.py pins the
      # intended selection, so it will tell you.
      - id: rustfmt
        name: rustfmt (check)
        language: system
        entry: cargo fmt --all -- --check
        files: &rust_files '^(Cargo\.(toml|lock)|rust-toolchain\.toml|rustfmt\.toml|\.pre-commit-config\.yaml|\.github/workflows/lint-and-(test|clippy)\.yml|tests/fixtures/.*|(crates|clients/tui|smoke)/.*\.(rs|toml|sql))$'
        pass_filenames: false
        stages: [pre-push]
      - id: rust-clippy
        name: clippy
        language: system
        entry: cargo clippy --all-features --all-targets -- -D warnings
        files: *rust_files
        pass_filenames: false
        stages: [pre-push]
