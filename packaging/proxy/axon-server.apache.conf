# Apache site for axon-server: the web client and the API on one HTTPS address.
#
# Sign in once on the server itself (http://127.0.0.1:8080/) BEFORE enabling
# this. The one-time first-sign-in page is limited to requests from the local
# machine, and behind this proxy every request comes from the local machine.
#
# Enable it on Debian and Ubuntu:
#
#   sudo cp /usr/share/doc/axon-server/examples/axon-server.apache.conf /etc/apache2/sites-available/axon-server.conf
#   sudoedit /etc/apache2/sites-available/axon-server.conf   # ServerName and the two certificate paths
#   sudo a2enmod ssl proxy proxy_http proxy_wstunnel
#   sudo a2ensite axon-server
#   sudo apachectl configtest && sudo systemctl reload apache2
#
# On Fedora and RHEL, copy it to /etc/httpd/conf.d/axon-server.conf, install
# mod_ssl, and reload httpd; the proxy modules are loaded by default there.
#
# The certificate paths below are where certbot puts them
# (`sudo certbot certonly --apache -d axon.example.com`).

<VirtualHost *:443>
	ServerName axon.example.com

	SSLEngine on
	SSLCertificateFile    /etc/letsencrypt/live/axon.example.com/fullchain.pem
	SSLCertificateKeyFile /etc/letsencrypt/live/axon.example.com/privkey.pem

	ProxyRequests Off
	ProxyPreserveHost On

	# Matrix identifiers can contain an encoded slash (%2F). Apache answers
	# such a URL with 404 unless told otherwise, and `nocanon` below keeps it
	# from re-encoding the path on the way through.
	AllowEncodedSlashes NoDecode

	# Media uploads. axon-server enforces its own limit
	# ([media] max_upload_bytes); recent Apache defaults to 1 GB.
	LimitRequestBody 0

	# The live connection first, so it is not caught by the rule for `/`.
	ProxyPass        /v1/ws ws://127.0.0.1:8080/v1/ws
	ProxyPassReverse /v1/ws ws://127.0.0.1:8080/v1/ws

	ProxyPass        / http://127.0.0.1:8080/ nocanon
	ProxyPassReverse / http://127.0.0.1:8080/

	# Generous, so a quiet live connection is not dropped between heartbeats.
	ProxyTimeout 3600
</VirtualHost>

<VirtualHost *:80>
	ServerName axon.example.com
	Redirect permanent / https://axon.example.com/
</VirtualHost>
