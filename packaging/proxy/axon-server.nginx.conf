# nginx site for axon-server: the web client and the API on one HTTPS address.
#
# Sign in once on the server itself (http://127.0.0.1:8080/) BEFORE enabling
# this. The one-time first-sign-in page is limited to requests from the local
# machine, and behind this proxy every request comes from the local machine.
#
# Enable it on Debian and Ubuntu:
#
#   sudo cp /usr/share/doc/axon-server/examples/axon-server.nginx.conf /etc/nginx/sites-available/axon-server
#   sudoedit /etc/nginx/sites-available/axon-server   # server_name and the two certificate paths
#   sudo ln -s /etc/nginx/sites-available/axon-server /etc/nginx/sites-enabled/axon-server
#   sudo nginx -t && sudo systemctl reload nginx
#
# On Fedora and RHEL there is no sites-available; copy it to
# /etc/nginx/conf.d/axon-server.conf instead and skip the `ln`.
#
# The certificate paths below are where certbot puts them
# (`sudo certbot certonly --nginx -d axon.example.com`).

# Forward the WebSocket handshake only when the client asked for one.
map $http_upgrade $axon_connection {
	default upgrade;
	""      close;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name axon.example.com;

	ssl_certificate     /etc/letsencrypt/live/axon.example.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/axon.example.com/privkey.pem;

	# nginx refuses bodies over 1 MB by default, which would break media
	# uploads. axon-server enforces its own limit ([media] max_upload_bytes).
	client_max_body_size 0;

	location / {
		# No path after the port: nginx then forwards the request line
		# exactly as received. Matrix identifiers can contain an encoded
		# slash (%2F), which must reach axon-server still encoded.
		proxy_pass http://127.0.0.1:8080;
		proxy_http_version 1.1;

		proxy_set_header Host              $host;
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		# The live connection, /v1/ws.
		proxy_set_header Upgrade    $http_upgrade;
		proxy_set_header Connection $axon_connection;
		proxy_read_timeout 1h;
		proxy_send_timeout 1h;

		# Stream uploads and media instead of spooling them to disk first.
		proxy_request_buffering off;
		proxy_buffering off;
	}
}

server {
	listen 80;
	listen [::]:80;
	server_name axon.example.com;
	return 301 https://$host$request_uri;
}
