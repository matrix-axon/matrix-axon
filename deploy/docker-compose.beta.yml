# One-file beta deployment for Axon (ADR 0052) — prebuilt images, no clone, no build.
#
# This is the standalone, pull-only counterpart to deploy/docker-compose.yml (which
# builds from source and adds the tailscale/caddy TLS profiles). It brings up
# Postgres + axon-server + the web client from images published to GHCR. Keep the
# shared service config in sync with deploy/docker-compose.yml.
#
# Prereqs: Docker. The images are public on GHCR, so no `docker login` or
# credentials are needed. Then, from a directory containing this file:
#
#   docker compose up -d                                       # images pull automatically
#   docker compose logs axon-server | grep 'bootstrap is armed' # open that one-time URL
#
# Open the browser at http://<host>:8080 (or AXON_PORT). `web` is the single front
# door — it serves the SPA and reverse-proxies the API (/v1, /healthz, /bootstrap,
# /v1/ws) to axon-server on one origin, so first sign-in is zero-paste and no CORS
# is involved. Update with `docker compose pull && docker compose up -d`; stop with
# `docker compose down` (add `-v` to also wipe data). For encrypted remote access,
# run `tailscale serve http://localhost:8080` on the host, or use the full deploy/
# stack's tailscale/caddy profiles (see deploy/README.md).

services:
  postgres:
    image: postgres:16
    # Docker gives each container a 64 MB /dev/shm. Postgres puts parallel-query and
    # parallel-VACUUM working memory there, so a manual VACUUM of a large table
    # fails with "could not resize shared memory segment ... No space left on
    # device" at the default size.
    shm_size: 256mb
    # Bridge-internal only (no published port); the default password is a formality
    # between two containers. Override POSTGRES_PASSWORD only if you publish 5432.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-axon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-axon}
      POSTGRES_DB: ${POSTGRES_DB:-axon}
    volumes:
      - axon-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  axon-server:
    # Prebuilt image (override with AXON_SERVER_IMAGE). `docker compose up` pulls it
    # automatically — no build context, so no repo checkout is needed. Not published
    # to the host: `web` fronts it on the compose bridge.
    image: ${AXON_SERVER_IMAGE:-ghcr.io/matrix-axon/axon-server:beta}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Compose owns Postgres; the entrypoint's `axon init` writes this URL into the
      # generated config on the axon-data volume.
      DATABASE_URL: postgres://${POSTGRES_USER:-axon}:${POSTGRES_PASSWORD:-axon}@postgres:5432/${POSTGRES_DB:-axon}
      # Zero-paste first web sign-in (see deploy/README.md). _ALLOW_REMOTE is needed
      # because requests arrive via the `web` proxy, so axon sees the bridge IP, not
      # loopback; the one-time unguessable access code + wrong-URL lockout are the
      # protection. Set AXON_BOOTSTRAP_WEB=false to opt out (then use token-paste).
      AXON_SERVER__BOOTSTRAP_WEB_AUTO: "${AXON_BOOTSTRAP_WEB:-true}"
      AXON_SERVER__BOOTSTRAP_WEB_ALLOW_REMOTE: "${AXON_BOOTSTRAP_WEB:-true}"
      AXON_SERVER__WEB_CLIENT_URL: "/"
    volumes:
      - axon-data:/var/lib/axon
    restart: unless-stopped

  web:
    # The single host-published HTTP entry point: serves the SPA and proxies the API
    # to axon-server (override with AXON_WEB_IMAGE). Set AXON_PUBLISH_ADDR=127.0.0.1
    # if you front it with a TLS proxy on the host.
    image: ${AXON_WEB_IMAGE:-ghcr.io/matrix-axon/axon-web:beta}
    depends_on:
      axon-server:
        condition: service_healthy
    ports:
      - "${AXON_PUBLISH_ADDR:-0.0.0.0}:${AXON_PORT:-8080}:8080"
    healthcheck:
      # /healthz is proxied to axon, so a pass means the SPA is served AND axon is
      # reachable. caddy:2 is alpine-based; busybox provides wget.
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped

volumes:
  axon-pgdata:
  axon-data:
