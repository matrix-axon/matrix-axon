[workspace]
resolver = "2"

members = [
    "crates/axon-server",
    "crates/axon-core",
    "crates/axon-store",
    "crates/axon-sync",
    "crates/axon-crypto",
    "crates/axon-search",
    "crates/axon-media",
    "crates/axon-api",
    "crates/axon-itest",
    "clients/tui",
    "smoke/local-stack",
    "smoke/server",
    "smoke/tui",
]

# The Tauri shell (ADR 0102, M-W12) carries its own [workspace] table and is
# deliberately not a member of this one: `cargo build --workspace` runs on
# every platform in cross-build.yml, and `cargo clippy --all-targets` runs in
# the pre-push gate, none of which should need webkit2gtk or should be building
# a desktop app. Listed here so cargo treats the nested package as excluded on
# purpose rather than reporting it as an unlisted workspace member.
exclude = ["clients/web/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
license = "Apache-2.0"

[workspace.dependencies]
axon-core   = { path = "crates/axon-core" }
axon-store  = { path = "crates/axon-store" }
axon-sync   = { path = "crates/axon-sync" }
axon-crypto = { path = "crates/axon-crypto" }
axon-search = { path = "crates/axon-search" }
axon-media  = { path = "crates/axon-media" }
axon-api    = { path = "crates/axon-api" }

# Async runtime + HTTP
tokio = { version = "1", default-features = false }
tokio-util = { version = "0.7", default-features = false }
futures-util = { version = "0.3", default-features = false }
axum  = { version = "0.8" }
bytes = { version = "1" }

# Database. sqlx-core / sqlx-postgres are pinned exactly: axon-store depends on
# their semver-exempt `_`-prefixed features (runtime + TLS provider selection),
# which exist only because we bypass the `sqlx` umbrella to keep sqlx-sqlite out
# of the graph (see axon-store/Cargo.toml + ADR 0006). An exact pin stops a
# `cargo update` from silently renaming those features out from under us.
sqlx = { version = "0.8", default-features = false }
sqlx-core = { version = "=0.8.2", default-features = false }
sqlx-postgres = { version = "=0.8.2", default-features = false }
# Reproduces sqlx-postgres's own `_sqlx_migrations` advisory-lock id (see
# axon-server/src/db.rs) so the dev-only repair command locks against the
# same key the real migrator uses around schema-history operations.
crc = { version = "3" }
uuid = { version = "1", default-features = false }
chrono = { version = "0.4", default-features = false }
# Embeds the migrations/ directory into the binary at compile time. We can't use
# sqlx's `migrate!` macro (it lives in the `sqlx` umbrella, which we drop to keep
# sqlx-sqlite out of the graph — see axon-store/Cargo.toml), so we embed here and
# build a sqlx_core::migrate::Migrator ourselves.
include_dir = { version = "0.7" }
# Cross-platform filesystem free-space query (statvfs) for the M10 backfill
# disk-space safety valve. Already in the graph transitively; named here so the
# valve can call it directly. Default features (sync) are enough.
fs4 = { version = "0.13" }

# Matrix. Keep the SDK's default features (they carry its intended TLS/HTTP
# stack — 0.18 exposes no standalone tls feature). Extra features are added at
# the crate level.
matrix-sdk    = { version = "0.18" }
matrix-sdk-ui = { version = "0.18" }

# Platform-standard data/config/cache directory resolution (XDG on Linux,
# ~/Library on macOS, Known Folders on Windows) for the on-disk store defaults.
directories = { version = "6" }

# Already in the graph transitively (matrix-sdk's dependency tree); named here
# so axon-server can read RLIMIT_NOFILE directly (Unix-only; see main.rs).
libc = { version = "0.2" }

# Config + serialization
figment    = { version = "0.10" }
serde      = { version = "1" }
serde_json = { version = "1" }
toml       = { version = "0.8" }
toml_edit  = { version = "0.22" }
# URL parsing — `axon init` (ADR 0051) derives Postgres credentials from the
# database URL it writes, to start a matching local Docker container.
url        = { version = "2" }
percent-encoding = { version = "2" }
base64     = { version = "0.22" }
mime       = { version = "0.3" }
reqwest    = { version = "0.13", default-features = false }
tokio-tungstenite = { version = "0.26", default-features = false }
ratatui    = { version = "0.30", features = ["crossterm_0_29"] }
crossterm  = { version = "0.29" }

# Full-text search index (M9). Tantivy ships the tokenizer + token filters
# (LowerCaser / AsciiFoldingFilter / Stemmer) the body analyzer chains together.
tantivy = { version = "0.26" }

# OpenAPI spec emission from handler signatures (M5a).
utoipa = { version = "5" }

# CLI arg parsing for the `axon` binary's subcommands (M7b `axon token …`).
clap = { version = "4", features = ["derive"] }

# Bearer-token hashing (SHA-256) + minting (CSPRNG) for M7b. `base64` (above) does
# the encoding.
sha2 = { version = "0.10" }
rand = { version = "0.9" }

# OAuth 2.0 / OIDC (M14). `jsonwebtoken` verifies id_token signatures/claims
# against a JWKS-selected key; discovery-doc fetch and token-exchange are
# hand-rolled over `reqwest` (see axon-api/src/oauth/generic.rs) rather than
# pulling a heavier OIDC-client crate — see ADR 0054. `governor` provides the
# per-IP/per-state rate limiter over `/v1/oauth/*`.
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs", "use_pem"] }
governor = { version = "0.7" }

# Smoke harnesses (smoke/*). Cross-platform PTY + a terminal screen model so the
# TUI smoke suite can drive the real binary and assert on rendered rows.
portable-pty = { version = "0.9" }
vt100        = { version = "0.16" }

# Errors
thiserror = { version = "2" }
anyhow    = { version = "1" }

# Async trait methods behind `dyn` (the API's MessageSender port + its
# composition-root adapter in axon-server).
async-trait = { version = "0.1" }

# Observability
tracing            = { version = "0.1" }
tracing-subscriber = { version = "0.3", default-features = false }
tower-http         = { version = "0.6" }
dotenvy            = { version = "0.15" }
